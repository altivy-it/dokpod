# Semente do Altivy.Groundwork (componente release): pertence ao projeto.
# Contrato (ver .github/CI-CD.md): chamado por gw-release.yml com a tag e a versão; publica
# artefatos imutáveis no Environment "release" e envia artifacts release-entries-* com
# { kind, name, reference, digest } para o manifesto da release. Em republish, só envia o que falta.
name: Publish

on:
  workflow_call:
    inputs:
      tag:
        description: Tag da release (vX.Y.Z)
        type: string
        required: true
      version:
        description: Versão da release (X.Y.Z)
        type: string
        required: true
      republish:
        description: Reenvio de artefatos ausentes de uma release existente
        type: boolean
        default: false

permissions: {}

jobs:

  containers:
    name: Containers
    uses: ./.github/workflows/gw-container-images.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      tag: ${{ inputs.tag }}
      images: >-
        [{"name":"dokpod-api","context":".","dockerfile":"backend/apps/Dokpod.ControlPlane.Api/Dockerfile"},
        {"name":"dokpod-bff","context":".","dockerfile":"backend/apps/Dokpod.Bff/Dockerfile"},
        {"name":"dokpod-web","context":".","dockerfile":"frontend/web/Dockerfile"},
        {"name":"dokpod-agent","context":".","dockerfile":"deploy/agent/Dockerfile"},
        {"name":"dokpod-api-business","context":".","dockerfile":"backend/apps/Dokpod.ControlPlane.Api/Business.Dockerfile"}]

  # Assinatura cosign sem chave por digest (docs/seguranca.md). A identidade é a deste workflow:
  # publish.yml@refs/heads/main no merge do Release PR e publish.yml@refs/tags/vX.Y.Z no republish.
  sign:
    name: Sign images
    needs: containers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download container entries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-entries-container-*
          path: artifacts/entries
          merge-multiple: true

      - name: Install cosign (binário oficial conferido por SHA-256)
        env:
          COSIGN_VERSION: v3.1.3
          COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
        run: |
          curl -fsSL -o /tmp/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  /tmp/cosign" | sha256sum --check --strict
          sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign

      - name: Sign once per digest and verify identity
        env:
          GH_TOKEN: ${{ github.token }}
          IDENTITY: ^https://github\.com/${{ github.repository }}/\.github/workflows/publish\.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+.*)$
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          verify() {
            cosign verify "$1" --certificate-identity-regexp "${IDENTITY}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null 2>&1
          }
          for ref in $(jq -r '.[] | "\(.reference)@\(.digest)"' artifacts/entries/*.json); do
            if verify "$ref"; then echo "Já assinada: $ref"; continue; fi
            cosign sign --yes "$ref"
            verify "$ref" || { echo "::error::Assinatura de $ref não confere com a identidade esperada."; exit 1; }
            echo "Assinada e verificada: $ref"
          done

  build-assets:
    name: Build assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      # Pacote do agente Windows (spec 006 T003): self-contained win-x64, zip, SHA-256 e manifesto.
      - name: Build release assets
        shell: bash
        run: ./deploy/agent/publish-windows-agent.sh "$PWD/artifacts/release-assets" win-x64

      - name: Upload assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: artifacts/release-assets/*
          if-no-files-found: error
          retention-days: 7

  assets:
    name: Assets
    needs: build-assets
    uses: ./.github/workflows/gw-github-assets.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      tag: ${{ inputs.tag }}
      artifact-name: release-assets

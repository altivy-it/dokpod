# Semente do Altivy.Groundwork (componente ci): pertence ao projeto.
# Cada job do projeto entra em "needs" do job Result, o ÚNICO check obrigatório da main (ver .github/CI-CD.md).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

# Em PRs e merge groups, uma execução nova espera a anterior: cancelar uma execução em andamento deixa
# um check Result com falha no mesmo commit e pode bloquear o merge. Pushes/dispatches podem cancelar.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}

jobs:
  hygiene:
    name: Hygiene
    uses: ./.github/workflows/gw-pr-hygiene.yml
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read

  gitleaks:
    name: Gitleaks
    uses: ./.github/workflows/gw-gitleaks.yml
    permissions:
      contents: read

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ci
    permissions:
      contents: read
    env:
      DOKPOD_CONTROLPLANE_CONNECTION: ${{ github.event_name == 'pull_request' && 'Host=postgres;Port=5432;Database=keycloak;Username=keycloak;Search Path=dokpod;Command Timeout=300' || secrets.DOKPOD_CI_CONTROLPLANE_CONNECTION }}
      DOKPOD_TEST_POSTGRES_CONNECTION: ${{ github.event_name == 'pull_request' && 'Host=postgres;Port=5432;Database=keycloak;Username=keycloak;Search Path=dokpod;Command Timeout=300' || secrets.DOKPOD_CI_TEST_POSTGRES_CONNECTION }}
    container:
      image: lzocateli/dotnet-sdk:10.0.403-noble-v1
      options: --user 0
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: keycloak
          POSTGRES_USER: keycloak
          POSTGRES_HOST_AUTH_METHOD: ${{ github.event_name == 'pull_request' && 'trust' || 'scram-sha-256' }}
          POSTGRES_PASSWORD: ${{ github.event_name == 'pull_request' && 'ci' || secrets.DOKPOD_CI_POSTGRES_PASSWORD }}
        options: >-
          --health-cmd "pg_isready -U keycloak -d keycloak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Spec 033 T007: os arquivos psql do catálogo SQL são testados pelo psql, como o instalador os executa.
      - name: Install PostgreSQL client
        run: apt-get update && apt-get install --yes --no-install-recommends postgresql-client

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore backend projects
        run: dotnet restore Dokpod.slnx

      - name: Apply database migrations
        run: >-
          dotnet ef database update
          --project backend/libs/Dokpod.ControlPlane.Infrastructure/Dokpod.ControlPlane.Infrastructure.csproj
          --startup-project backend/apps/Dokpod.ControlPlane.Api/Dokpod.ControlPlane.Api.csproj
          --configuration Release

      - name: Test backend and PostgreSQL integrations
        run: dotnet test Dokpod.slnx --configuration Release --verbosity minimal

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: lzocateli/angular-cli:22.2.4-node24.22.1-bookworm-v1
      options: --user 0
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate and verify API client
        run: |
          npm run generate:api
          git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code

      - name: Test frontend
        run: npm test -- --watch=false

      - name: Build frontend
        run: npm run build -- --configuration production --base-href /dokpod/

  images:
    name: Images
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build, scan and generate SBOMs
        shell: pwsh
        run: ./tools/scripts/validate-release-images.ps1 -Image all -Tag ci

      - name: Upload security artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-security
          path: artifacts/security-local/*.json
          if-no-files-found: error
          retention-days: 14

  # Spec 033 T052: smoke test da imagem do instalador. O estágio de testes roda o Pester inteiro dentro da imagem (os
  # testes com engine real ficam pulados sem socket); a imagem final responde --help sem efeitos e, com as respostas de
  # exemplo e sem socket rootless, o plan valida as respostas e para nos pré-requisitos com código 3.
  installer:
    name: Installer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pester inside the installer image
        run: |
          docker build --target test -t dokpod-installer:ci-test -f deploy/installer/Dockerfile .
          docker run --rm dokpod-installer:ci-test

      - name: PSScriptAnalyzer
        run: >
          docker run --rm -v "$PWD/deploy/installer:/i:ro" --entrypoint pwsh dokpod-installer:ci-test -NoProfile -Command
          "Invoke-ScriptAnalyzer -Path /i/src -Recurse -Settings /i/PSScriptAnalyzerSettings.psd1 -EnableExit"

      - name: Help and plan with the example answers
        run: |
          set -euo pipefail
          docker build --target runtime -t dokpod-installer:ci -f deploy/installer/Dockerfile .
          docker run --rm dokpod-installer:ci --help | grep -q 'Instalador do Dokpod'
          set +e
          docker run --rm --user 0:0 -v "$PWD/deploy/installer/examples:/ex:ro" dokpod-installer:ci plan --answers /ex/answers.yaml --non-interactive > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          [ "$code" -eq 3 ] || { echo "::error::plan --dry-run sem engine rootless devia sair com 3, saiu com $code."; exit 1; }
          grep -q 'nada foi alterado' plan.txt

  # Spec 031 História 1 (T013 a T015): a CE continua sem licença. T013 roda no job Backend; aqui ficam a tela
  # de Configurações sem seção Licença (E2E com respostas simuladas pela borda nginx) e a prova de que a API CE não
  # tenta nenhuma comunicação externa durante início, operação e reinício (D-012, SC-002).
  licensing-ce:
    name: Licensing CE
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: CE settings without licensing (mock E2E)
        env:
          CONTAINER_ENGINE: docker
        run: bash frontend/tests/e2e/mock/run-mock-e2e.sh -- -k test_031

      - name: CE API without egress
        shell: pwsh
        run: ./tools/scripts/test-licensing-no-egress.ps1 -Build -Engine docker

      - name: Upload licensing evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licensing-ce
          path: |
            artifacts/licensing-no-egress/report.json
            artifacts/e2e/mock/junit.xml
          if-no-files-found: warn
          retention-days: 14

  # Spec 034: portal de documentação (Docusaurus). O artefato não é publicado; deploy é etapa separada.
  docs-portal:
    name: Docs portal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: lzocateli/angular-cli:22.2.4-node24.22.1-bookworm-v1
      options: --user 0
    defaults:
      run:
        working-directory: docs/portal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check translations
        run: npm run check:translations

      - name: Build portal and search index
        run: npm run build

      - name: Build artifact manifest
        run: npm run build:manifest

      - name: Check artifact
        run: npm run check:artifact

      - name: Upload portal artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-portal-site
          path: docs/portal/artifacts/docs-portal-site/
          if-no-files-found: error
          retention-days: 14

  docs-portal-e2e:
    name: Docs portal E2E
    needs: docs-portal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: docs/portal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download portal artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-portal-site
          path: docs/portal/artifacts/docs-portal-site

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Test portal (versions, locale, theme, search, a11y, CSP)
        env:
          SITE_DIR: artifacts/docs-portal-site/site
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-portal-playwright-report
          path: docs/portal/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # Spec 005 T012: imagens publicadas por digest, assinadas sem chave (identidade OIDC deste workflow) e com atestado de
  # proveniência. Só roda em tag `v*`, depois dos gates de backend, frontend e imagens (inclusive a política de
  # vulnerabilidades). A verificação exige a identidade exata do workflow e o emissor do GitHub.
  result:
    name: Result
    if: ${{ always() }}
    needs:
      - hygiene
      - gitleaks
      - backend
      - frontend
      - images
      - installer
      - licensing-ce
      - docs-portal
      - docs-portal-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Evaluate required jobs
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$NEEDS")
          if [[ -n "$failed" ]]; then
            echo "::error::Jobs obrigatórios sem sucesso: ${failed//$'\n'/, }"
            exit 1
          fi
          echo "Todos os jobs obrigatórios terminaram com sucesso."

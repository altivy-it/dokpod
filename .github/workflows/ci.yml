name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - development
    # Spec 005 T012: publicação assinada só em tag de release criada por um humano.
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ci
    permissions:
      contents: read
    env:
      DOKPOD_CONTROLPLANE_CONNECTION: ${{ github.event_name == 'pull_request' && 'Host=postgres;Port=5432;Database=keycloak;Username=keycloak;Search Path=dokpod;Command Timeout=300' || secrets.DOKPOD_CI_CONTROLPLANE_CONNECTION }}
      DOKPOD_TEST_POSTGRES_CONNECTION: ${{ github.event_name == 'pull_request' && 'Host=postgres;Port=5432;Database=keycloak;Username=keycloak;Search Path=dokpod;Command Timeout=300' || secrets.DOKPOD_CI_TEST_POSTGRES_CONNECTION }}
    container:
      image: lzocateli/dotnet-sdk:10.0.402-noble-v1
      options: --user 0
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: keycloak
          POSTGRES_USER: keycloak
          POSTGRES_HOST_AUTH_METHOD: ${{ github.event_name == 'pull_request' && 'trust' || 'scram-sha-256' }}
          POSTGRES_PASSWORD: ${{ github.event_name == 'pull_request' && 'ci' || secrets.DOKPOD_CI_POSTGRES_PASSWORD }}
        options: >-
          --health-cmd "pg_isready -U keycloak -d keycloak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore backend projects
        run: dotnet restore Dokpod.slnx

      - name: Apply database migrations
        run: >-
          dotnet ef database update
          --project backend/libs/Dokpod.ControlPlane.Infrastructure/Dokpod.ControlPlane.Infrastructure.csproj
          --startup-project backend/apps/Dokpod.ControlPlane.Api/Dokpod.ControlPlane.Api.csproj
          --configuration Release

      - name: Test backend and PostgreSQL integrations
        run: dotnet test Dokpod.slnx --configuration Release --verbosity minimal

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: lzocateli/angular-cli:22.1.0-node24.15.0-bookworm
      options: --user 0
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate and verify API client
        run: |
          npm run generate:api
          git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code

      - name: Test frontend
        run: npm test -- --watch=false

      - name: Build frontend
        run: npm run build -- --configuration production --base-href /dokpod/

  images:
    name: Images
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build, scan and generate SBOMs
        shell: pwsh
        run: ./tools/scripts/validate-release-images.ps1 -Image all -Tag ci

      - name: Upload security artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-security
          path: artifacts/security-local/*.json
          if-no-files-found: error
          retention-days: 14

  # Spec 005 T012: imagens publicadas por digest, assinadas sem chave (identidade OIDC deste workflow) e com atestado de
  # proveniência. Só roda em tag `v*`, depois dos gates de backend, frontend e imagens (inclusive a política de
  # vulnerabilidades). A verificação exige a identidade exata do workflow e o emissor do GitHub.
  release-images:
    name: Release images (${{ matrix.image }})
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - backend
      - frontend
      - images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: api
            dockerfile: backend/apps/Dokpod.ControlPlane.Api/Dockerfile
          - image: bff
            dockerfile: backend/apps/Dokpod.Bff/Dockerfile
          - image: web
            dockerfile: frontend/web/Dockerfile
          - image: agent
            dockerfile: deploy/agent/Dockerfile
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/dokpod-${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          build-args: IMAGE_VERSION=${{ github.ref_name }}
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign by digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify signature identity and issuer
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "Assinatura verificada: ${IMAGE}@${DIGEST}"

  result:
    name: Result
    if: ${{ always() }}
    needs:
      - backend
      - frontend
      - images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Evaluate required jobs
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
        shell: bash
        run: |
          if [[ "$BACKEND_RESULT" != "success" ]]; then
            echo "Backend terminou com: $BACKEND_RESULT"
            exit 1
          fi
          if [[ "$IMAGES_RESULT" != "success" ]]; then
            echo "Images terminou com: $IMAGES_RESULT"
            exit 1
          fi
          if [[ "$FRONTEND_RESULT" != "success" ]]; then
            echo "Frontend terminou com: $FRONTEND_RESULT"
            exit 1
          fi
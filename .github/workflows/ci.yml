# Semente do Altivy.Groundwork (componente ci): pertence ao projeto.
# Cada job do projeto entra em "needs" do job Result, o ÚNICO check obrigatório da main (ver .github/CI-CD.md).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

# Em PRs, uma execução nova espera a anterior: cancelar uma execução em andamento deixa um check
# Result com falha no mesmo commit, e o ruleset considera todas as execuções do check, bloqueando o merge.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

jobs:
  hygiene:
    name: Hygiene
    uses: ./.github/workflows/gw-pr-hygiene.yml
    permissions:
      contents: read

  gitleaks:
    name: Gitleaks
    uses: ./.github/workflows/gw-gitleaks.yml
    permissions:
      contents: read

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ci
    permissions:
      contents: read
    env:
      DOKPOD_CONTROLPLANE_CONNECTION: ${{ github.event_name == 'pull_request' && 'Host=postgres;Port=5432;Database=keycloak;Username=keycloak;Search Path=dokpod;Command Timeout=300' || secrets.DOKPOD_CI_CONTROLPLANE_CONNECTION }}
      DOKPOD_TEST_POSTGRES_CONNECTION: ${{ github.event_name == 'pull_request' && 'Host=postgres;Port=5432;Database=keycloak;Username=keycloak;Search Path=dokpod;Command Timeout=300' || secrets.DOKPOD_CI_TEST_POSTGRES_CONNECTION }}
    container:
      image: lzocateli/dotnet-sdk:10.0.402-noble-v1
      options: --user 0
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: keycloak
          POSTGRES_USER: keycloak
          POSTGRES_HOST_AUTH_METHOD: ${{ github.event_name == 'pull_request' && 'trust' || 'scram-sha-256' }}
          POSTGRES_PASSWORD: ${{ github.event_name == 'pull_request' && 'ci' || secrets.DOKPOD_CI_POSTGRES_PASSWORD }}
        options: >-
          --health-cmd "pg_isready -U keycloak -d keycloak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore backend projects
        run: dotnet restore Dokpod.slnx

      - name: Apply database migrations
        run: >-
          dotnet ef database update
          --project backend/libs/Dokpod.ControlPlane.Infrastructure/Dokpod.ControlPlane.Infrastructure.csproj
          --startup-project backend/apps/Dokpod.ControlPlane.Api/Dokpod.ControlPlane.Api.csproj
          --configuration Release

      - name: Test backend and PostgreSQL integrations
        run: dotnet test Dokpod.slnx --configuration Release --verbosity minimal

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: lzocateli/angular-cli:22.2.4-node24.22.1-bookworm-v1
      options: --user 0
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate and verify API client
        run: |
          npm run generate:api
          git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code

      - name: Test frontend
        run: npm test -- --watch=false

      - name: Build frontend
        run: npm run build -- --configuration production --base-href /dokpod/

  images:
    name: Images
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build, scan and generate SBOMs
        shell: pwsh
        run: ./tools/scripts/validate-release-images.ps1 -Image all -Tag ci

      - name: Upload security artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-security
          path: artifacts/security-local/*.json
          if-no-files-found: error
          retention-days: 14

  # Spec 005 T012: imagens publicadas por digest, assinadas sem chave (identidade OIDC deste workflow) e com atestado de
  # proveniência. Só roda em tag `v*`, depois dos gates de backend, frontend e imagens (inclusive a política de
  # vulnerabilidades). A verificação exige a identidade exata do workflow e o emissor do GitHub.
  result:
    name: Result
    if: ${{ always() }}
    needs:
      - hygiene
      - gitleaks
      - backend
      - frontend
      - images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Evaluate required jobs
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$NEEDS")
          if [[ -n "$failed" ]]; then
            echo "::error::Jobs obrigatórios sem sucesso: ${failed//$'\n'/, }"
            exit 1
          fi
          echo "Todos os jobs obrigatórios terminaram com sucesso."

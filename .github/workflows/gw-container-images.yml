# Gerenciado pelo Altivy.Groundwork (componente publish-containers). Não edite: mudanças vão para o catálogo.
# Chamado pelo publish.yml na tag. Publica cada imagem uma única vez por versão, atesta o digest
# e emite release-entries-container-<nome>. Imagem já publicada nunca é reconstruída nem sobrescrita.
name: Publish container images

on:
  workflow_call:
    inputs:
      tag:
        description: Tag da release (vX.Y.Z)
        type: string
        required: true
      images:
        description: 'JSON: [{"name":"api","context":".","dockerfile":"deploy/api/Dockerfile"}]'
        type: string
        required: true
      registry:
        description: Prefixo do registro; vazio usa ghcr.io/<owner>
        type: string
        default: ''

permissions: {}

jobs:
  image:
    name: Image ${{ matrix.image.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Read attestation policy
        id: policy
        shell: pwsh
        run: |
          Import-Module ./tools/scripts/ci/GroundworkRelease.psm1
          $enabled = Get-AttestationPolicy -Config (Read-CiCdConfig)
          if (-not $enabled) {
            Write-Output '::warning title=Atestação desativada::"attestations": false em .github/ci-cd.json; artefatos sem atestação não são aceitos pelo deploy.'
          }
          "enabled=$($enabled.ToString().ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Log in to GHCR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      - name: Build and push once per version
        id: publish
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          IMAGE_NAME: ${{ matrix.image.name }}
          IMAGE_CONTEXT: ${{ matrix.image.context }}
          IMAGE_DOCKERFILE: ${{ matrix.image.dockerfile }}
          REGISTRY: ${{ inputs.registry }}
        run: >
          ./tools/scripts/ci/Publish-ContainerImage.ps1 -Tag $env:RELEASE_TAG -Name $env:IMAGE_NAME
          -Context $env:IMAGE_CONTEXT -Dockerfile $env:IMAGE_DOCKERFILE -Registry $env:REGISTRY
          -EntriesPath "artifacts/release-entries/container-$env:IMAGE_NAME.json" -OutputPath $env:GITHUB_OUTPUT

      - name: Attest image provenance
        if: ${{ steps.policy.outputs.enabled == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Upload release entries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-entries-container-${{ matrix.image.name }}
          path: artifacts/release-entries/container-${{ matrix.image.name }}.json
          if-no-files-found: error
          retention-days: 7

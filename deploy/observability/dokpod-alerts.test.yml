# Testes das regras de alerta (promtool test rules). Rodar a partir de deploy/observability:
#   podman run --rm -v "$PWD":/w:ro,z -w /w --entrypoint promtool docker.io/prom/prometheus:v3.5.0 test rules dokpod-alerts.test.yml
rule_files:
  - dokpod-alerts.yml

evaluation_interval: 1m

tests:
  - name: API e BFF sem telemetria
    interval: 1m
    input_series:
      - series: 'target_info{job="dokpod-api"}'
        values: '1 1 1 _ _ _ _'
      - series: 'target_info{job="dokpod-bff"}'
        values: '1 1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: DokpodApiSemTelemetria
        exp_alerts: []
      - eval_time: 6m
        alertname: DokpodApiSemTelemetria
        exp_alerts:
          - exp_labels:
              severity: critical
              job: dokpod-api
            exp_annotations:
              summary: A API do Dokpod parou de enviar métricas há 2 minutos.
              runbook: docs/runbooks/observabilidade.md#dokpodapisemtelemetria
      - eval_time: 6m
        alertname: DokpodBffSemTelemetria
        exp_alerts: []

  - name: Keycloak indisponível só com decisões indeterminadas
    interval: 1m
    input_series:
      - series: 'dokpod_authorization_decisions_total{authorization_outcome="allowed"}'
        values: '0+100x15'
      - series: 'dokpod_authorization_decisions_total{authorization_outcome="indeterminate"}'
        values: '0x5 0+10x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: DokpodKeycloakIndisponivel
        exp_alerts: []
      - eval_time: 10m
        alertname: DokpodKeycloakIndisponivel
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Decisões de autorização indeterminadas; o Keycloak não está respondendo à API.
              runbook: docs/runbooks/observabilidade.md#dokpodkeycloakindisponivel

  - name: Pool do banco perto do limite
    interval: 1m
    input_series:
      - series: 'db_client_connection_count{job="dokpod-api", db_client_connection_state="used"}'
        values: '10x5 38x10'
      - series: 'db_client_connection_count{job="dokpod-api", db_client_connection_state="idle"}'
        values: '30x5 2x10'
      - series: 'db_client_connection_max{job="dokpod-api"}'
        values: '40x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: DokpodPoolDoBancoEsgotando
        exp_alerts: []
      - eval_time: 12m
        alertname: DokpodPoolDoBancoEsgotando
        exp_alerts:
          - exp_labels:
              severity: warning
              job: dokpod-api
            exp_annotations:
              summary: dokpod-api usa mais de 90% do pool de conexões do PostgreSQL.
              runbook: docs/runbooks/observabilidade.md#dokpodpooldobancoesgotando

  - name: Queda de agentes
    interval: 1m
    input_series:
      - series: 'dokpod_agents_connected{agent_engine="docker", agent_version="1.0.0"}'
        values: '100x10 80x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: DokpodAgentesDesconectando
        exp_alerts: []
      - eval_time: 17m
        alertname: DokpodAgentesDesconectando
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Mais de 10% dos agentes conectados nos últimos 30 minutos caíram.
              runbook: docs/runbooks/observabilidade.md#dokpodagentesdesconectando

  - name: Troca de instância da API não conta como queda de agentes
    interval: 1m
    input_series:
      # Restart da API: a instância antiga some (séries viram stale) e a nova volta com os mesmos 10 agentes.
      - series: 'dokpod_agents_connected{agent_engine="docker", agent_version="1.0.0", service_instance_id="a"}'
        values: '10x10 stale'
      - series: 'dokpod_agents_connected{agent_engine="docker", agent_version="1.0.0", service_instance_id="b"}'
        values: '_x11 10x15'
    alert_rule_test:
      - eval_time: 25m
        alertname: DokpodAgentesDesconectando
        exp_alerts: []

  - name: Comandos lentos acima de 3 s no p95
    interval: 1m
    input_series:
      # 100 comandos por minuto: primeiro rápidos (≤ 0,5 s), depois quase todos entre 2,5 e 5 s.
      - series: 'dokpod_command_duration_seconds_bucket{le="0.5"}'
        values: '0+100x10 1000+5x20'
      - series: 'dokpod_command_duration_seconds_bucket{le="2.5"}'
        values: '0+100x10 1000+5x20'
      - series: 'dokpod_command_duration_seconds_bucket{le="5"}'
        values: '0+100x10 1000+100x20'
      - series: 'dokpod_command_duration_seconds_bucket{le="+Inf"}'
        values: '0+100x10 1000+100x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: DokpodComandosLentos
        exp_alerts: []
      - eval_time: 30m
        alertname: DokpodComandosLentos
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: O p95 de despacho → resultado dos comandos passou de 3 s.
              runbook: docs/runbooks/observabilidade.md#dokpodcomandoslentos

  - name: Falhas de comando ignoram alvo desatualizado
    interval: 1m
    input_series:
      - series: 'dokpod_commands_completed_total{command_kind="RestartContainer", command_state="succeeded", command_failure_code=""}'
        values: '0+10x30'
      - series: 'dokpod_commands_completed_total{command_kind="RestartContainer", command_state="failed", command_failure_code="stale_target"}'
        values: '0+5x30'
      - series: 'dokpod_commands_completed_total{command_kind="RestartContainer", command_state="failed", command_failure_code="engine_error"}'
        values: '0x15 0+2x15'
    alert_rule_test:
      - eval_time: 15m
        alertname: DokpodComandosFalhando
        exp_alerts: []
      - eval_time: 30m
        alertname: DokpodComandosFalhando
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Mais de 5% dos comandos falharam nos últimos 15 minutos (sem contar alvo desatualizado).
              runbook: docs/runbooks/observabilidade.md#dokpodcomandosfalhando

  - name: Indeterminado em série que nasce com valor alerta (achado A3)
    interval: 1m
    input_series:
      - series: 'dokpod_commands_completed_total{command_kind="restart", command_state="succeeded", command_failure_code=""}'
        values: '0+5x40'
      - series: 'dokpod_commands_completed_total{command_kind="restart", command_state="indeterminate", command_failure_code="engine_result_unknown"}'
        values: '_x10 2x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: DokpodComandosIndeterminados
        exp_alerts: []
      - eval_time: 12m
        alertname: DokpodComandosIndeterminados
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Há comandos com resultado indeterminado; reconcilie o estado no host.
              runbook: docs/runbooks/observabilidade.md#dokpodcomandosindeterminados
      - eval_time: 35m
        alertname: DokpodComandosIndeterminados
        exp_alerts: []

  - name: Indeterminado que cresce em série existente alerta
    interval: 1m
    input_series:
      - series: 'dokpod_commands_completed_total{command_kind="restart", command_state="indeterminate", command_failure_code="engine_result_unknown"}'
        values: '1x30 2x10'
    alert_rule_test:
      - eval_time: 25m
        alertname: DokpodComandosIndeterminados
        exp_alerts: []
      - eval_time: 33m
        alertname: DokpodComandosIndeterminados
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Há comandos com resultado indeterminado; reconcilie o estado no host.
              runbook: docs/runbooks/observabilidade.md#dokpodcomandosindeterminados

  - name: Falha de auditoria em série que nasce com valor alerta (achado A3)
    interval: 1m
    input_series:
      - series: 'dokpod_audit_append_failures_total'
        values: '_x5 1x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: DokpodAuditoriaFalhando
        exp_alerts: []
      - eval_time: 7m
        alertname: DokpodAuditoriaFalhando
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Falha ao gravar eventos de auditoria; ações auditadas podem estar sendo recusadas.
              runbook: docs/runbooks/observabilidade.md#dokpodauditoriafalhando

  - name: Falha de auditoria alerta imediatamente
    interval: 1m
    input_series:
      - series: 'dokpod_audit_append_failures_total'
        values: '0 0 0 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: DokpodAuditoriaFalhando
        exp_alerts: []
      - eval_time: 4m
        alertname: DokpodAuditoriaFalhando
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Falha ao gravar eventos de auditoria; ações auditadas podem estar sendo recusadas.
              runbook: docs/runbooks/observabilidade.md#dokpodauditoriafalhando

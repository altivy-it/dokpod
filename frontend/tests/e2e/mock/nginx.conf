# Borda nginx da E2E com respostas simuladas: SPA estática + BFF/API simulados.
server {
    listen 8080;
    server_name _;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(bff|api|hubs|__mock)/ {
        proxy_pass http://dokpod-mock:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Mockups de docs/design/app para o loop de verificação visual (somente laboratório).
    location = /design/project/support.js {
        alias /design/artifact-type/dc-runtime.js;
    }
    location /design/ {
        alias /design/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

@switch (sessionService.state()) {
  @case ('loading') {
    <main class="alt-page alt-app dok-entry">
      <dok-empty-state kind="loading" title="Carregando sessão" detail="Verificando sua sessão no Keycloak." />
    </main>
  }
  @case ('error') {
    <main class="alt-page alt-app dok-entry">
      <dok-empty-state kind="offline" title="Não foi possível carregar a sessão" detail="O BFF não respondeu. Verifique a conexão e tente novamente.">
        <button dok-button variant="outline" size="sm" startIcon="refresh" type="button" (click)="loadSession()">Tentar novamente</button>
      </dok-empty-state>
    </main>
  }
  @case ('expired') {
    <main class="alt-page alt-app dok-entry">
      <dok-empty-state kind="forbidden" icon="lock" title="Sessão expirada" detail="Sua sessão no Keycloak terminou. Entre novamente para continuar de onde parou.">
        <button dok-button variant="primary" size="sm" startIcon="lock" type="button" (click)="login()">Entrar novamente</button>
      </dok-empty-state>
    </main>
  }
  @case ('authenticated') {
    <dok-app-shell
      [userName]="sessionService.displayName()"
      [userGroup]="sessionService.session()?.displayGroup ?? null"
      [userInitials]="sessionService.initials()"
      [scopes]="directory.scopes()"
      (signOut)="logout()"
    >
      <router-outlet />
    </dok-app-shell>
  }
  @default {
    <main class="alt-page alt-app dok-entry">
      <section class="dok-entry__card alt-glass" aria-labelledby="entry-title">
        <div class="dok-entry__brand">
          <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true">
            <rect x="2" y="2" width="60" height="60" rx="14" fill="var(--brand-mark)" />
            <path d="M16 14H35C46 14 52 21 52 32C52 43 46 50 35 50H16V14Z" fill="var(--ink)" />
            <path d="M27 24H34C39 24 42 27 42 32C42 37 39 40 34 40H27V24Z" fill="var(--brand-mark)" />
            <rect x="10" y="27" width="11" height="10" fill="var(--brand-mark)" stroke="var(--ink)" stroke-width="4" />
          </svg>
          <span>Dokpod</span>
        </div>
        <span class="eyebrow">Console operacional</span>
        <h1 id="entry-title">Docker e Podman sob uma única operação</h1>
        <p class="app-body">Acesse hosts e containers conforme as permissões definidas no Keycloak.</p>
        <button dok-button variant="primary" size="md" startIcon="lock" type="button" (click)="login()">Entrar com Keycloak</button>
      </section>
    </main>
  }
}
<dok-toast-host />

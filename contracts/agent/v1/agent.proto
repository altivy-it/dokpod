syntax = "proto3";

package dokpod.agent.v1;

option csharp_namespace = "Dokpod.Agent.Contracts.V1";

import "google/protobuf/timestamp.proto";

service AgentControl {
  rpc Connect(stream AgentMessage) returns (stream ControlPlaneMessage);
  // Spec 014: terminal em canal separado, aberto pelo agente após ExecOpenRequest (at-most-once).
  rpc Exec(stream ExecFrame) returns (stream ExecFrame);
}

message MessageMetadata {
  string protocol_version = 1;
  string session_id = 2;
  uint64 fencing_token = 3;
  uint64 sequence = 4;
  google.protobuf.Timestamp occurred_at = 5;
  string correlation_id = 6;
}

message AgentMessage {
  MessageMetadata metadata = 1;

  oneof payload {
    AgentHello hello = 10;
    Heartbeat heartbeat = 11;
    InventorySnapshotPage snapshot_page = 12;
    InventoryDelta inventory_delta = 13;
    CommandAccepted command_accepted = 14;
    CommandResult command_result = 15;
    ReconciliationState reconciliation_state = 16;
    // 17-22 reservados pelas specs 008-012; enviados só com capability aceita (008 D-009).
    EngineEventBatch engine_events = 17;
    ResourceSampleBatch resource_samples = 18;
    ContainerQueryResponse container_query_response = 19;
    LogChunk log_chunk = 20;
    // Spec 012: inventário de imagens (capability 12 confirmada).
    ImageSnapshotPage image_snapshot_page = 21;
    ImageDelta image_delta = 22;
    // Spec 018: inventário de volumes (capability 16 confirmada).
    VolumeSnapshotPage volume_snapshot_page = 23;
    // Spec 019: inventário de redes (capability 18 confirmada).
    NetworkSnapshotPage network_snapshot_page = 24;
    // Spec 020: configuração de registros do host (capability 20 confirmada).
    RegistryInventory registry_inventory = 25;
    // Spec 021: inventário de pods do Podman (capability 21 confirmada).
    PodSnapshotPage pod_snapshot_page = 26;
    // Spec 025: resultado da verificação de nova versão (capability 23 confirmada).
    ImageUpdateCheckResultPage image_update_check_result = 27;
  }
}

message ControlPlaneMessage {
  MessageMetadata metadata = 1;

  oneof payload {
    SessionEstablished session_established = 10;
    AgentCommand command = 11;
    SnapshotRequest snapshot_request = 12;
    ReconciliationRequest reconciliation_request = 13;
    // 14-15 enviados só a agentes com CAPABILITY_CONTAINER_INSPECT/LOGS (008 D-009).
    ContainerQueryRequest container_query = 14;
    LogStreamControl log_stream_control = 15;
    // Spec 014: só a agentes com CAPABILITY_CONTAINER_EXEC.
    ExecOpenRequest exec_open = 16;
    // Spec 025: só a agentes com CAPABILITY_IMAGE_UPDATE_CHECK.
    ImageUpdateCheckRequest image_update_check = 17;
  }
}

message ExecOpenRequest {
  string exec_session_id = 1;
  string container_id = 2;
  uint32 cols = 3;
  uint32 rows = 4;
  google.protobuf.Timestamp expires_at = 5;
  uint32 max_output_bytes_per_second = 6;
}

message ExecFrame {
  oneof frame {
    ExecHandshake handshake = 1;
    bytes stdin = 2;
    bytes output = 3;
    ExecResize resize = 4;
    ExecStatus status = 5;
  }
}

message ExecHandshake {
  string exec_session_id = 1;
  string session_id = 2;
  uint64 fencing_token = 3;
}

message ExecResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

// reason: motivos de término/recusa do data-model da 014 (inclui shell_not_available e label_disabled).
message ExecStatus {
  ExecState state = 1;
  string reason = 2;
  string shell = 3;
  bool container_user_is_root = 4;
  bool orphan_suspected = 5;
}

enum ExecState {
  EXEC_STATE_UNSPECIFIED = 0;
  EXEC_STATE_OPENED = 1;
  EXEC_STATE_CLOSED = 2;
  EXEC_STATE_ERROR = 3;
}

message AgentHello {
  string agent_version = 1;
  EngineKind engine = 2;
  string engine_version = 3;
  OperatingSystem operating_system = 4;
  string operating_system_version = 5;
  Architecture architecture = 6;
  repeated Capability capabilities = 7;
  repeated string supported_protocol_versions = 8;
  string host_name = 9;
  uint32 cpu_count = 10;
  uint64 memory_bytes = 11;
  string engine_api_version = 12;
  bool engine_rootless = 13;
  // Spec 031 (FR-013, FR-017): origem de cpu_count. Agente N-1 não envia (UNSPECIFIED) e a CPU conta como desconhecida.
  CpuCountSource cpu_count_source = 14;
}

enum CpuCountSource {
  CPU_COUNT_SOURCE_UNSPECIFIED = 0;
  // Informado pelo engine (Docker/Podman info): confiável para a apuração.
  CPU_COUNT_SOURCE_ENGINE = 1;
  // Environment.ProcessorCount do processo do agente: pode refletir o limite do container; nunca confiável.
  CPU_COUNT_SOURCE_PROCESS_FALLBACK = 2;
}

message SessionEstablished {
  string selected_protocol_version = 1;
  string session_id = 2;
  uint64 fencing_token = 3;
  uint32 heartbeat_interval_seconds = 4;
  uint32 maximum_message_bytes = 5;
  // Ausente = servidor N-1: o agente não envia payloads novos (008 D-009).
  repeated Capability accepted_capabilities = 6;
}

message Heartbeat {
  uint64 last_applied_command_sequence = 1;
  uint64 inventory_revision = 2;
  // Spec 012: revisão do inventário de imagens (0 = agente sem inventário de imagens).
  uint64 image_revision = 3;
  // Spec 018: revisão do inventário de volumes (0 = agente sem inventário de volumes).
  uint64 volume_revision = 4;
  // Spec 019: revisão do inventário de redes (0 = agente sem inventário de redes).
  uint64 network_revision = 5;
  // Spec 021: revisão do inventário de pods (0 = agente sem inventário de pods).
  uint64 pod_revision = 6;
}

message InventorySnapshotPage {
  string snapshot_id = 1;
  uint64 inventory_revision = 2;
  uint32 page_number = 3;
  bool is_last_page = 4;
  repeated ContainerState containers = 5;
}

message InventoryDelta {
  uint64 base_revision = 1;
  uint64 inventory_revision = 2;
  repeated ContainerChange changes = 3;
}

message ContainerChange {
  ChangeKind kind = 1;
  ContainerState container = 2;
  string container_id = 3;
}

message ContainerState {
  string container_id = 1;
  string name = 2;
  string image_reference = 3;
  ContainerLifecycleState state = 4;
  string revision = 5;
  google.protobuf.Timestamp observed_at = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp started_at = 8;
  ContainerHealth health = 9;
  uint32 restart_count = 10;
  optional int32 exit_code = 11;
  bool oom_killed = 12;
  repeated PortBinding ports = 13;
  // tag 14 não alocada: pods ficam para o adapter Libpod futuro.
  // Spec 012: ImageID do engine (sha256:...), base de "imagem em uso".
  string image_id = 15;
}

message PortBinding {
  string host_ip = 1;
  uint32 host_port = 2;
  uint32 container_port = 3;
  TransportProtocol protocol = 4;
}

message ContainerQueryRequest {
  string query_id = 1;
  ContainerQueryKind kind = 2;
  string container_id = 3;
  google.protobuf.Timestamp deadline = 4;
  LogQuery logs = 5;
  // Spec 018: nome do volume em CONTAINER_QUERY_KIND_VOLUME_USAGE.
  string volume_name = 6;
}

message LogQuery {
  uint32 tail = 1;
  google.protobuf.Timestamp since = 2;
  google.protobuf.Timestamp until = 3;
  string contains = 4;
  uint32 max_bytes = 5;
}

// Cada mensagem tem no máximo 256 KiB (limite gRPC do servidor: 1 MiB); a API monta as partes.
message ContainerQueryResponse {
  string query_id = 1;
  QueryResultState state = 2;
  string failure_code = 3;
  bytes sanitized_json = 4;
  repeated LogLine lines = 5;
  bool truncated = 6;
  uint32 sequence = 7;
  bool final = 8;
  repeated string redacted_paths = 9;
}

message LogLine {
  google.protobuf.Timestamp timestamp = 1;
  LogStream stream = 2;
  string text = 3;
  string level = 4;
}

message LogStreamControl {
  string session_id = 1;
  LogStreamAction action = 2;
  string container_id = 3;
  string contains = 4;
  uint32 max_lines_per_second = 5;
  google.protobuf.Timestamp expires_at = 6;
  uint32 max_bytes_per_second = 7;
}

message LogChunk {
  string session_id = 1;
  repeated LogLine lines = 2;
  uint32 omitted_lines = 3;
  bool ended = 4;
  string end_reason = 5;
}

// Spec 009: uma amostra bruta por intervalo; nenhum campo carrega processo, argumento, variável ou label.
message ResourceSampleBatch {
  google.protobuf.Timestamp sampled_at = 1;
  HostResourceSample host = 2;
  repeated ContainerResourceSample containers = 3;
  uint32 dropped_count = 4;
}

message HostResourceSample {
  optional double cpu_percent = 1;
  optional uint64 memory_used_bytes = 2;
  optional uint64 memory_total_bytes = 3;
}

message ContainerResourceSample {
  string container_id = 1;
  optional double cpu_percent_of_limit = 2;
  optional double cpu_percent_of_host = 3;
  optional uint64 memory_used_bytes = 4;
  optional uint64 memory_limit_bytes = 5;
  optional uint64 net_rx_bps = 6;
  optional uint64 net_tx_bps = 7;
  optional uint64 blk_read_bps = 8;
  optional uint64 blk_write_bps = 9;
  optional double cpu_limit_cores = 10;
}

message EngineEventBatch {
  repeated EngineEvent events = 1;
  uint32 dropped_count = 2;
}

message EngineEvent {
  string source_key = 1;
  EngineEventType type = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string subject_id = 4;
  string subject_name = 5;
  map<string, string> attributes = 6;
  uint32 aggregated_count = 7;
}

message AgentCommand {
  string command_id = 1;
  CommandKind kind = 2;
  string container_id = 3;
  string expected_container_revision = 4;
  bytes payload_hash = 5;
  google.protobuf.Timestamp deadline = 6;
  // Spec 012 D-001: parâmetros de comandos com alvo de host.
  oneof parameters {
    PullImageParameters pull_image = 7;
    CreateContainerParameters create_container = 8;
    // Spec 018: remoção de volume sem uso (nunca forçada).
    RemoveVolumeParameters remove_volume = 9;
    // Spec 019: remoção de rede sem uso (nunca desconecta containers).
    RemoveNetworkParameters remove_network = 10;
    // Spec 021: ação sobre o pod inteiro (nunca parar, pausar ou reiniciar o pod do agente).
    PodActionParameters pod_action = 11;
  }
}

message PodActionParameters {
  string pod_id = 1;
  string name = 2;
  PodAction action = 3;
}

enum PodAction {
  POD_ACTION_UNSPECIFIED = 0;
  POD_ACTION_START = 1;
  POD_ACTION_STOP = 2;
  POD_ACTION_RESTART = 3;
  POD_ACTION_PAUSE = 4;
  POD_ACTION_UNPAUSE = 5;
}

message RemoveVolumeParameters {
  string name = 1;
}

message RemoveNetworkParameters {
  string network_id = 1;
  string name = 2;
}

// Spec 013: allowlist fechada; valores de variáveis só trafegam dentro do canal mTLS.
message CreateContainerParameters {
  string image = 1;
  string name = 2;
  repeated PortBinding ports = 3;
  repeated EnvironmentVariable environment = 4;
  repeated VolumeMount volumes = 5;
  string network = 6;
  optional double cpu_limit_cores = 7;
  optional uint64 memory_limit_bytes = 8;
  RestartPolicy restart_policy = 9;
  HealthCheck healthcheck = 10;
  bool auto_remove = 11;
}

message EnvironmentVariable {
  string name = 1;
  oneof source {
    string value = 2;
    HostSecretRef secret = 3;
  }
  bool sensitive = 4;
}

message HostSecretRef {
  HostSecretKind kind = 1;
  string name = 2;
}

message VolumeMount {
  VolumeMountType type = 1;
  string source = 2;
  string target = 3;
  bool read_only = 4;
}

message RestartPolicy {
  RestartPolicyName name = 1;
  uint32 maximum_retry_count = 2;
}

message HealthCheck {
  repeated string test = 1;
  uint32 interval_seconds = 2;
  uint32 timeout_seconds = 3;
  uint32 retries = 4;
  uint32 start_period_seconds = 5;
  HealthCheckOnFailure on_failure = 6;
}

enum HostSecretKind {
  HOST_SECRET_KIND_UNSPECIFIED = 0;
  HOST_SECRET_KIND_PODMAN_SECRET = 1;
  HOST_SECRET_KIND_FILE = 2;
}

enum VolumeMountType {
  VOLUME_MOUNT_TYPE_UNSPECIFIED = 0;
  VOLUME_MOUNT_TYPE_VOLUME = 1;
  VOLUME_MOUNT_TYPE_BIND = 2;
}

enum HealthCheckOnFailure {
  HEALTH_CHECK_ON_FAILURE_UNSPECIFIED = 0;
  HEALTH_CHECK_ON_FAILURE_NONE = 1;
  HEALTH_CHECK_ON_FAILURE_RESTART = 2;
}

enum RestartPolicyName {
  RESTART_POLICY_NAME_UNSPECIFIED = 0;
  RESTART_POLICY_NAME_NO = 1;
  RESTART_POLICY_NAME_ON_FAILURE = 2;
  RESTART_POLICY_NAME_ALWAYS = 3;
  RESTART_POLICY_NAME_UNLESS_STOPPED = 4;
}

// Plataforma vazia = plataforma do host; a API não expõe `platform` nesta spec.
message PullImageParameters {
  string reference = 1;
  string platform = 2;
}

message CommandAccepted {
  string command_id = 1;
  CommandAcceptance acceptance = 2;
  string failure_code = 3;
}

message CommandResult {
  string command_id = 1;
  CommandResultState state = 2;
  string failure_code = 3;
  string observed_container_revision = 4;
  google.protobuf.Timestamp completed_at = 5;
  // Spec 012: resultado do pull.
  string resolved_image_digest = 6;
  uint64 image_size_bytes = 7;
  // Spec 013: container criado (também em falha de start, quando o container permanece criado).
  string created_container_id = 8;
  // Spec 021: membros do pod fora do estado esperado após a ação (falha parcial).
  repeated string failed_containers = 9;
}

message SnapshotRequest {
  string reason_code = 1;
  // Spec 012: ausente = containers (servidor N-1).
  SnapshotScope scope = 2;
}

enum SnapshotScope {
  SNAPSHOT_SCOPE_UNSPECIFIED = 0;
  SNAPSHOT_SCOPE_CONTAINERS = 1;
  SNAPSHOT_SCOPE_IMAGES = 2;
  SNAPSHOT_SCOPE_VOLUMES = 3;
  SNAPSHOT_SCOPE_NETWORKS = 4;
  // Spec 020: reenvio da configuração de registros.
  SNAPSHOT_SCOPE_REGISTRIES = 5;
  SNAPSHOT_SCOPE_PODS = 6;
}

// Spec 021 D-001: página ≤ 256 KiB e ≤ 500 pods; `engine_without_pods` quando o engine não tem pods (Docker).
message PodSnapshotPage {
  string snapshot_id = 1;
  uint64 pod_revision = 2;
  uint32 page_number = 3;
  bool is_last_page = 4;
  repeated PodState pods = 5;
  bool engine_without_pods = 6;
}

message PodState {
  string pod_id = 1;
  string name = 2;
  string status = 3;
  google.protobuf.Timestamp created_at = 4;
  map<string, string> labels = 5;
  repeated string networks = 6;
  string infra_id = 7;
  repeated PodMember containers = 8;
  // Pod que contém o container do próprio agente (D-002).
  bool agent_pod = 9;
  bool truncated = 10;
}

message PodMember {
  string container_id = 1;
  string name = 2;
  string status = 3;
  uint32 restarts = 4;
  bool infra = 5;
}

// Spec 018 D-001: página ≤ 256 KiB e ≤ 500 volumes; caminho no host nunca é publicado.
message VolumeSnapshotPage {
  string snapshot_id = 1;
  uint64 volume_revision = 2;
  uint32 page_number = 3;
  bool is_last_page = 4;
  repeated VolumeState volumes = 5;
}

message VolumeState {
  string name = 1;
  string driver = 2;
  string scope = 3;
  google.protobuf.Timestamp created_at = 4;
  map<string, string> labels = 5;
  repeated VolumeContainerMount mounts = 6;
  bool truncated = 7;
}

message VolumeContainerMount {
  string container_id = 1;
  string container_name = 2;
  string destination = 3;
  bool read_only = 4;
}

// Spec 019 D-001: página ≤ 256 KiB e ≤ 500 redes; opções do driver nunca são publicadas.
message NetworkSnapshotPage {
  string snapshot_id = 1;
  uint64 network_revision = 2;
  uint32 page_number = 3;
  bool is_last_page = 4;
  repeated NetworkState networks = 5;
}

message NetworkState {
  string network_id = 1;
  string name = 2;
  string driver = 3;
  string scope = 4;
  bool internal = 5;
  bool ipv6 = 6;
  bool attachable = 7;
  bool system = 8;
  google.protobuf.Timestamp created_at = 9;
  repeated NetworkSubnet subnets = 10;
  map<string, string> labels = 11;
  repeated NetworkContainerConnection containers = 12;
  bool truncated = 13;
}

message NetworkSubnet {
  string subnet = 1;
  string gateway = 2;
}

// Inclui containers parados (sem endereço).
message NetworkContainerConnection {
  string container_id = 1;
  string container_name = 2;
  string ipv4_address = 3;
  string ipv6_address = 4;
}

// Spec 020 D-002: até 500 registros; credenciais só como indicação (nunca valores).
message RegistryInventory {
  uint64 revision = 1;
  // Falso quando o engine não informou a configuração (registros vêm só da credencial).
  bool config_available = 2;
  repeated RegistryState registries = 3;
}

message RegistryState {
  string registry = 1;
  repeated string mirrors = 2;
  string mirror_of = 3;
  bool insecure = 4;
  bool blocked = 5;
  bool search = 6;
  bool credential = 7;
}

// Spec 012 D-007: página ≤ 256 KiB e ≤ 200 imagens; tags e digests limitados a 64 cada.
message ImageSnapshotPage {
  string snapshot_id = 1;
  uint64 image_revision = 2;
  uint32 page_number = 3;
  bool is_last_page = 4;
  repeated ImageState images = 5;
}

message ImageDelta {
  uint64 base_revision = 1;
  uint64 image_revision = 2;
  repeated ImageChange changes = 3;
}

message ImageChange {
  ChangeKind kind = 1;
  ImageState image = 2;
  string image_id = 3;
}

message ImageState {
  string image_id = 1;
  repeated string repo_tags = 2;
  repeated string repo_digests = 3;
  uint64 size_bytes = 4;
  google.protobuf.Timestamp created_at = 5;
  string architecture = 6;
  string os = 7;
  bool truncated = 8;
}

message ReconciliationRequest {
  repeated string command_ids = 1;
}

message ReconciliationState {
  repeated CommandResult results = 1;
}

enum EngineKind {
  ENGINE_KIND_UNSPECIFIED = 0;
  ENGINE_KIND_DOCKER = 1;
  ENGINE_KIND_PODMAN = 2;
}

enum OperatingSystem {
  OPERATING_SYSTEM_UNSPECIFIED = 0;
  OPERATING_SYSTEM_LINUX = 1;
  OPERATING_SYSTEM_WINDOWS = 2;
}

enum Architecture {
  ARCHITECTURE_UNSPECIFIED = 0;
  ARCHITECTURE_AMD64 = 1;
  ARCHITECTURE_ARM64 = 2;
}

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_INVENTORY = 1;
  CAPABILITY_CONTAINER_START = 2;
  CAPABILITY_CONTAINER_STOP = 3;
  CAPABILITY_CONTAINER_RESTART = 4;
  CAPABILITY_CONTAINER_DELETE = 5;
  CAPABILITY_ENGINE_EVENTS = 6;
  CAPABILITY_RESOURCE_METRICS = 7;
  CAPABILITY_CONTAINER_PAUSE = 8;
  CAPABILITY_CONTAINER_UNPAUSE = 9;
  CAPABILITY_CONTAINER_INSPECT = 10;
  CAPABILITY_CONTAINER_LOGS = 11;
  CAPABILITY_IMAGE_INVENTORY = 12;
  CAPABILITY_IMAGE_PULL = 13;
  CAPABILITY_CONTAINER_CREATE = 14;
  CAPABILITY_CONTAINER_EXEC = 15;
  CAPABILITY_VOLUME_INVENTORY = 16;
  CAPABILITY_VOLUME_REMOVE = 17;
  CAPABILITY_NETWORK_INVENTORY = 18;
  CAPABILITY_NETWORK_REMOVE = 19;
  CAPABILITY_REGISTRY_INVENTORY = 20;
  CAPABILITY_POD_INVENTORY = 21;
  CAPABILITY_POD_ACTIONS = 22;
  // Spec 025: consulta o registro pela API OCI Distribution e compara digests (ADR 2026-0009).
  CAPABILITY_IMAGE_UPDATE_CHECK = 23;
}

enum ContainerQueryKind {
  CONTAINER_QUERY_KIND_UNSPECIFIED = 0;
  CONTAINER_QUERY_KIND_SUMMARY = 1;
  CONTAINER_QUERY_KIND_INSPECT = 2;
  CONTAINER_QUERY_KIND_LOGS = 3;
  // Spec 013: consultas de host (sem container_id); exigem CAPABILITY_CONTAINER_CREATE.
  CONTAINER_QUERY_KIND_HOST_SECRETS = 4;
  CONTAINER_QUERY_KIND_HOST_NETWORKS = 5;
  CONTAINER_QUERY_KIND_HOST_VOLUMES = 6;
  // Spec 018: tamanho e referências de um volume (system df); exige CAPABILITY_VOLUME_INVENTORY.
  CONTAINER_QUERY_KIND_VOLUME_USAGE = 7;
}

enum QueryResultState {
  QUERY_RESULT_STATE_UNSPECIFIED = 0;
  QUERY_RESULT_STATE_OK = 1;
  QUERY_RESULT_STATE_NOT_FOUND = 2;
  QUERY_RESULT_STATE_NOT_SUPPORTED = 3;
  QUERY_RESULT_STATE_TOO_LARGE = 4;
  QUERY_RESULT_STATE_FAILED = 5;
}

enum LogStream {
  LOG_STREAM_UNSPECIFIED = 0;
  LOG_STREAM_STDOUT = 1;
  LOG_STREAM_STDERR = 2;
}

enum LogStreamAction {
  LOG_STREAM_ACTION_UNSPECIFIED = 0;
  LOG_STREAM_ACTION_START = 1;
  LOG_STREAM_ACTION_STOP = 2;
}

enum ContainerHealth {
  CONTAINER_HEALTH_UNSPECIFIED = 0;
  CONTAINER_HEALTH_NONE = 1;
  CONTAINER_HEALTH_STARTING = 2;
  CONTAINER_HEALTH_HEALTHY = 3;
  CONTAINER_HEALTH_UNHEALTHY = 4;
}

enum TransportProtocol {
  TRANSPORT_PROTOCOL_UNSPECIFIED = 0;
  TRANSPORT_PROTOCOL_TCP = 1;
  TRANSPORT_PROTOCOL_UDP = 2;
  TRANSPORT_PROTOCOL_SCTP = 3;
}

enum EngineEventType {
  ENGINE_EVENT_TYPE_UNSPECIFIED = 0;
  ENGINE_EVENT_TYPE_CONTAINER_DIED = 1;
  ENGINE_EVENT_TYPE_CONTAINER_OOM_KILLED = 2;
  ENGINE_EVENT_TYPE_CONTAINER_UNHEALTHY = 3;
  ENGINE_EVENT_TYPE_CONTAINER_RECOVERED = 4;
  ENGINE_EVENT_TYPE_CONTAINER_AUTO_RESTARTED = 5;
  ENGINE_EVENT_TYPE_CONTAINER_CREATED = 6;
  ENGINE_EVENT_TYPE_CONTAINER_REMOVED = 7;
  ENGINE_EVENT_TYPE_IMAGE_PULLED = 8;
  ENGINE_EVENT_TYPE_IMAGE_REMOVED = 9;
  ENGINE_EVENT_TYPE_VOLUME_REMOVED = 10;
  // Spec 014: exec de terminal ainda em execução após reinício do agente (D-007).
  ENGINE_EVENT_TYPE_EXEC_ORPHAN_SUSPECTED = 11;
}

enum ChangeKind {
  CHANGE_KIND_UNSPECIFIED = 0;
  CHANGE_KIND_UPSERT = 1;
  CHANGE_KIND_REMOVE = 2;
}

enum ContainerLifecycleState {
  CONTAINER_LIFECYCLE_STATE_UNSPECIFIED = 0;
  CONTAINER_LIFECYCLE_STATE_CREATED = 1;
  CONTAINER_LIFECYCLE_STATE_RUNNING = 2;
  CONTAINER_LIFECYCLE_STATE_PAUSED = 3;
  CONTAINER_LIFECYCLE_STATE_RESTARTING = 4;
  CONTAINER_LIFECYCLE_STATE_EXITED = 5;
  CONTAINER_LIFECYCLE_STATE_DEAD = 6;
}

enum CommandKind {
  COMMAND_KIND_UNSPECIFIED = 0;
  COMMAND_KIND_START_CONTAINER = 1;
  COMMAND_KIND_STOP_CONTAINER = 2;
  COMMAND_KIND_RESTART_CONTAINER = 3;
  COMMAND_KIND_DELETE_CONTAINER = 4;
  COMMAND_KIND_PAUSE_CONTAINER = 5;
  COMMAND_KIND_UNPAUSE_CONTAINER = 6;
  COMMAND_KIND_PULL_IMAGE = 7;
  COMMAND_KIND_CREATE_CONTAINER = 8;
  COMMAND_KIND_REMOVE_VOLUME = 9;
  COMMAND_KIND_REMOVE_NETWORK = 10;
  COMMAND_KIND_POD_ACTION = 11;
}

enum CommandAcceptance {
  COMMAND_ACCEPTANCE_UNSPECIFIED = 0;
  COMMAND_ACCEPTANCE_ACCEPTED = 1;
  COMMAND_ACCEPTANCE_DUPLICATE = 2;
  COMMAND_ACCEPTANCE_REJECTED = 3;
}

enum CommandResultState {
  COMMAND_RESULT_STATE_UNSPECIFIED = 0;
  COMMAND_RESULT_STATE_SUCCEEDED = 1;
  COMMAND_RESULT_STATE_FAILED = 2;
  COMMAND_RESULT_STATE_INDETERMINATE = 3;
}

// Spec 025: verificação de nova versão de imagem (contracts/agent-protocol.md da spec). Até 500 itens, com
// referências já filtradas pela política de registros do estágio.
message ImageUpdateCheckRequest {
  string request_id = 1;
  repeated ImageUpdateCheckItem items = 2;
}

message ImageUpdateCheckItem {
  // Como no container (spec 012), com tag; nunca só digest.
  string reference = 1;
  // Imagem local com essa referência; vazio se ausente.
  string image_id = 2;
}

// Página até 256 KiB; um resultado por item, na ordem dos itens.
message ImageUpdateCheckResultPage {
  string request_id = 1;
  uint32 page_number = 2;
  bool is_last_page = 3;
  repeated ImageUpdateCheckResult results = 4;
}

message ImageUpdateCheckResult {
  string reference = 1;
  // os/arquitetura[/variante] da imagem local.
  string platform = 2;
  ImageUpdateState state = 3;
  // Motivo do data-model da spec 025; vazio em UP_TO_DATE e UPDATE_AVAILABLE. Nunca mensagem do registro.
  string reason = 4;
  string remote_digest = 5;
  string matched_local_digest = 6;
  google.protobuf.Timestamp checked_at = 7;
}

enum ImageUpdateState {
  IMAGE_UPDATE_STATE_UNSPECIFIED = 0;
  IMAGE_UPDATE_STATE_UP_TO_DATE = 1;
  IMAGE_UPDATE_STATE_UPDATE_AVAILABLE = 2;
  IMAGE_UPDATE_STATE_NOT_CHECKABLE = 3;
  IMAGE_UPDATE_STATE_FAILED = 4;
}

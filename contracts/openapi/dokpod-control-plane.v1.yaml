openapi: 3.1.0
info:
  title: Dokpod Control Plane API
  version: 1.0.0
  description: Contrato público inicial do cadastro de ambientes do Dokpod.
servers:
  - url: https://localhost:7443
paths:
  /api/v1/environments/{environmentId}/commands/{commandId}:
    get:
      operationId: getContainerCommand
      summary: Consulta o estado de um comando de ciclo de vida
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: commandId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Estado atual autorizado do comando.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerCommandStatus'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/environments/{environmentId}/containers/{containerId}/commands:
    post:
      operationId: submitContainerCommand
      summary: Solicita uma ação de ciclo de vida em um container
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: containerId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{64}$'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: Identifica de forma estável a intenção lógica para retries seguros.
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitContainerCommandRequest'
      responses:
        '202':
          description: Comando persistido ou replay idempotente aceito para processamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerCommandAccepted'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/environments/{environmentId}/containers:
    get:
      operationId: listEnvironmentContainers
      summary: Consulta o inventário reconciliado de containers do ambiente
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Cursor opaco retornado pela página anterior.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Página autorizada da projeção de inventário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/environments/{environmentId}:
    get:
      operationId: getEnvironment
      summary: Consulta o estado cadastral de um ambiente
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Estado cadastral do ambiente autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/environments:
    get:
      operationId: listEnvironments
      summary: Lista os ambientes autorizados para o usuário
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Cursor opaco retornado pela página anterior.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: stage
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Stage'
        - name: engine
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EngineKind'
        - name: situation
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/HostSituation'
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Página de ambientes que o usuário pode consultar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    post:
      operationId: registerEnvironment
      summary: Cadastra um ambiente
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterEnvironmentRequest'
      responses:
        '201':
          description: Ambiente cadastrado.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentCreated'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/environments/{environmentId}/agent-identity/revoke:
    post:
      operationId: revokeAgentIdentity
      summary: Revoga as identidades ativas do agente de um ambiente
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Identidade do agente revogada.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/environments/{environmentId}/stage:
    put:
      operationId: setEnvironmentStage
      summary: Define o estágio do ambiente (idempotente; mesmo estágio não audita)
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetEnvironmentStageRequest'
      responses:
        '200':
          description: Estágio aplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentStageChanged'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/overview:
    get:
      operationId: getOverview
      summary: Resumo agregado dos hosts autorizados e habilitados
      security:
        - bearerAuth: []
      parameters:
        - name: stage
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Stage'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Resumo da visão geral.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewSummary'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/events:
    get:
      operationId: listEvents
      summary: Eventos operacionais dos hosts autorizados, mais recentes primeiro
      security:
        - bearerAuth: []
      parameters:
        - name: stage
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Stage'
        - name: environmentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: severity
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EventSeverity'
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Página de eventos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalEventPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/containers:
    get:
      operationId: listContainers
      summary: Lista unificada de containers dos hosts autorizados (hosts sem permissão são excluídos)
      security:
        - bearerAuth: []
      parameters:
        - name: stage
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Stage'
        - name: environmentId
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: engine
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/EngineKind'
        - name: displayStatus
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ContainerDisplayStatus'
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 128
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, -name, displayStatus, environment, createdAt, -createdAt]
            default: name
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Página da lista unificada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerListPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/environments/{environmentId}/containers/{containerId}:
    get:
      operationId: getContainer
      summary: Detalhe do container (projeção, host, engine, reinícios 24 h)
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: containerId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Resultado autorizado (conteúdo nunca persistido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerDetail'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/environments/{environmentId}/containers/{containerId}/summary:
    get:
      operationId: getContainerSummary
      summary: Resumo de configuração sanitizado no agente (container:inspect)
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: containerId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Resultado autorizado (conteúdo nunca persistido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerConfigSummary'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '504':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/environments/{environmentId}/containers/{containerId}/inspect:
    get:
      operationId: inspectContainer
      summary: Inspeção sanitizada no agente (container:inspect)
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: containerId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Resultado autorizado (conteúdo nunca persistido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerInspection'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '504':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/environments/{environmentId}/containers/{containerId}/logs:
    get:
      operationId: getContainerLogs
      summary: Trecho de logs sob demanda, mascarado no agente (container:logs)
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: containerId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
        - name: tail
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 500
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: contains
          in: query
          required: false
          description: Texto literal (sem regex); removido dos logs de acesso.
          schema:
            type: string
            maxLength: 128
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Resultado autorizado (conteúdo nunca persistido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerLogPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '504':
          $ref: '#/components/responses/DependencyUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Identificador técnico opcional para correlação server-side.
  schemas:
    SubmitContainerCommandRequest:
      type: object
      required: [action, expectedContainerRevision, deadlineUtc]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [start, stop, restart, delete, pause, unpause]
        expectedContainerRevision:
          type: string
          minLength: 1
          maxLength: 255
        deadlineUtc:
          type: string
          format: date-time
    ContainerCommandAccepted:
      type: object
      required: [commandId]
      additionalProperties: false
      properties:
        commandId:
          type: string
          format: uuid
    ContainerCommandStatus:
      type: object
      required:
        - environmentId
        - commandId
        - action
        - containerId
        - expectedContainerRevision
        - state
        - failureCode
        - observedContainerRevision
        - deadlineUtc
        - createdAtUtc
        - updatedAtUtc
        - completedAtUtc
      additionalProperties: false
      properties:
        environmentId:
          type: string
          format: uuid
        commandId:
          type: string
          format: uuid
        action:
          type: string
          enum: [start, stop, restart, delete, pause, unpause]
        containerId:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
        expectedContainerRevision:
          type: string
          minLength: 1
          maxLength: 255
        state:
          type: string
          enum: [pending, dispatched, accepted, succeeded, failed, indeterminate]
        failureCode:
          type: [string, 'null']
          maxLength: 128
        observedContainerRevision:
          type: [string, 'null']
          maxLength: 255
        deadlineUtc:
          type: string
          format: date-time
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
        completedAtUtc:
          type: [string, 'null']
          format: date-time
    RegisterEnvironmentRequest:
      type: object
      required: [environmentId, name, host]
      additionalProperties: false
      properties:
        environmentId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
        host:
          type: string
          minLength: 1
          maxLength: 255
        enabled:
          type: boolean
          default: true
        scopes:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ResourceScope'
        stage:
          oneOf:
            - $ref: '#/components/schemas/Stage'
            - type: 'null'
    EnvironmentCreated:
      type: object
      required: [environmentId]
      additionalProperties: false
      properties:
        environmentId:
          type: string
          format: uuid
    EnvironmentState:
      type: object
      required: [environmentId, name, host, enabled, scopes]
      additionalProperties: false
      properties:
        environmentId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
        host:
          type: string
          minLength: 1
          maxLength: 255
        enabled:
          type: boolean
        scopes:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ResourceScope'
        stage:
          oneOf:
            - $ref: '#/components/schemas/Stage'
            - type: 'null'
        situation:
          $ref: '#/components/schemas/HostSituation'
        containerCount:
          type: [integer, 'null']
          minimum: 0
        agent:
          oneOf:
            - $ref: '#/components/schemas/HostAgentView'
            - type: 'null'
    EnvironmentPage:
      type: object
      required: [environments]
      additionalProperties: false
      properties:
        environments:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/EnvironmentState'
        nextCursor:
          type: [string, 'null']
    InventoryPage:
      type: object
      required: [environmentId, revision, observedAt, ageSeconds, containers]
      additionalProperties: false
      properties:
        environmentId:
          type: string
          format: uuid
        revision:
          type: integer
          format: int64
          minimum: 1
        observedAt:
          type: string
          format: date-time
        ageSeconds:
          type: integer
          format: int64
          minimum: 0
        containers:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ContainerInventory'
        nextCursor:
          type: [string, 'null']
    ContainerInventory:
      type: object
      required: [containerId, name, imageReference, state, revision, observedAt]
      additionalProperties: false
      properties:
        containerId:
          type: string
        name:
          type: string
        imageReference:
          type: string
        state:
          type: string
        revision:
          type: string
        observedAt:
          type: string
          format: date-time
        displayStatus:
          $ref: '#/components/schemas/ContainerDisplayStatus'
        createdAt:
          type: [string, 'null']
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        health:
          type: [string, 'null']
          enum: [none, starting, healthy, unhealthy, null]
        restartCount:
          type: [integer, 'null']
          minimum: 0
        exitCode:
          type: [integer, 'null']
        oomKilled:
          type: [boolean, 'null']
        ports:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/PortBinding'
    ContainerListItem:
      allOf:
        - $ref: '#/components/schemas/ContainerInventory'
        - type: object
          required: [environmentId, environmentName, hostConnected, allowedActions]
          properties:
            environmentId:
              type: string
              format: uuid
            environmentName:
              type: string
            stage:
              oneOf:
                - $ref: '#/components/schemas/Stage'
                - type: 'null'
            engine:
              type: [string, 'null']
              enum: [docker, podman, null]
            engineVersion:
              type: [string, 'null']
            hostConnected:
              type: boolean
            allowedActions:
              type: array
              items:
                type: string
                enum: [start, stop, restart, delete, pause, unpause]
    ContainerListPage:
      type: object
      required: [containers, summary]
      additionalProperties: false
      properties:
        containers:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ContainerListItem'
        summary:
          type: object
          required: [total, byDisplayStatus]
          additionalProperties: false
          properties:
            total:
              type: integer
            byDisplayStatus:
              $ref: '#/components/schemas/CountMap'
        observedAt:
          type: [string, 'null']
          format: date-time
        nextCursor:
          type: [string, 'null']
    ContainerDetail:
      allOf:
        - $ref: '#/components/schemas/ContainerListItem'
        - type: object
          required: [restartsLast24h, hostName, capabilities]
          properties:
            restartsLast24h:
              type: integer
              minimum: 0
            hostName:
              type: string
            capabilities:
              type: array
              items:
                type: string
    ContainerConfigSummary:
      type: object
      properties:
        command:
          type: string
        user:
          type: string
        workingDir:
          type: string
        healthcheck:
          type: [object, 'null']
          properties:
            test:
              type: string
            intervalSeconds:
              type: [number, 'null']
            timeoutSeconds:
              type: [number, 'null']
            retries:
              type: [integer, 'null']
        labels:
          type: object
          additionalProperties:
            type: string
        logging:
          type: [object, 'null']
          properties:
            driver:
              type: string
            options:
              type: object
              additionalProperties:
                type: string
        networks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              ipAddress:
                type: string
        volumes:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              name:
                type: string
              destination:
                type: string
              readOnly:
                type: boolean
        restartPolicy:
          type: [object, 'null']
          properties:
            name:
              type: string
            maximumRetryCount:
              type: integer
        cpuLimitCores:
          type: [number, 'null']
        memoryLimitBytes:
          type: [integer, 'null']
          format: int64
        environmentVariableCount:
          type: integer
        secretCount:
          type: integer
    ContainerInspection:
      type: object
      required: [json, truncated, redactedPaths]
      properties:
        json:
          type: object
        truncated:
          type: boolean
        redactedPaths:
          type: array
          items:
            type: string
    LogLineView:
      type: object
      required: [stream, text]
      properties:
        timestamp:
          type: [string, 'null']
          format: date-time
        stream:
          type: string
          enum: [stdout, stderr]
        level:
          type: [string, 'null']
        text:
          type: string
    ContainerLogPage:
      type: object
      required: [lines, truncated, omittedLines]
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/LogLineView'
        truncated:
          type: boolean
        omittedLines:
          type: integer
    ResourceScope:
      type: string
      enum:
        - environment:read
        - environment:manage
        - container:start
        - container:stop
        - container:restart
        - container:delete
        - audit:read
        - container:pause
        - container:inspect
        - container:logs
        - image:pull
        - container:create
        - container:exec
    Stage:
      type: string
      enum: [production, staging, development]
    EngineKind:
      type: string
      enum: [docker, podman]
    HostSituation:
      type: string
      enum: [disabled, disconnected, stale, update_required, unknown, up_to_date]
    ContainerDisplayStatus:
      type: string
      enum: [running, starting, failed, restarting, paused, stopped]
    EventSeverity:
      type: string
      enum: [success, info, warning, error, neutral]
    PortBinding:
      type: object
      required: [hostPort, containerPort, protocol]
      additionalProperties: false
      properties:
        hostIp:
          type: [string, 'null']
        hostPort:
          type: integer
          minimum: 0
          maximum: 65535
        containerPort:
          type: integer
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          enum: [tcp, udp, sctp]
    HostAgentView:
      type: object
      required: [connected, capabilities]
      additionalProperties: false
      properties:
        connected:
          type: boolean
        sessionStartedAt:
          type: [string, 'null']
          format: date-time
        lastSeenAt:
          type: [string, 'null']
          format: date-time
        agentVersion:
          type: [string, 'null']
        engine:
          type: [string, 'null']
          enum: [docker, podman, null]
        engineVersion:
          type: [string, 'null']
        engineApiVersion:
          type: [string, 'null']
        engineRootless:
          type: [boolean, 'null']
        operatingSystem:
          type: [string, 'null']
        operatingSystemVersion:
          type: [string, 'null']
        architecture:
          type: [string, 'null']
        hostName:
          type: [string, 'null']
        cpuCount:
          type: [integer, 'null']
        memoryBytes:
          type: [integer, 'null']
          format: int64
        capabilities:
          type: array
          items:
            type: string
    SetEnvironmentStageRequest:
      type: object
      required: [stage]
      additionalProperties: false
      properties:
        stage:
          oneOf:
            - $ref: '#/components/schemas/Stage'
            - type: 'null'
    EnvironmentStageChanged:
      type: object
      required: [environmentId, stage, changed]
      additionalProperties: false
      properties:
        environmentId:
          type: string
          format: uuid
        stage:
          oneOf:
            - $ref: '#/components/schemas/Stage'
            - type: 'null'
        changed:
          type: boolean
    CountMap:
      type: object
      additionalProperties:
        type: integer
        minimum: 0
    OverviewSummary:
      type: object
      required: [hosts, containers, engines, attentionEvents24h]
      additionalProperties: false
      properties:
        stage:
          oneOf:
            - $ref: '#/components/schemas/Stage'
            - type: 'null'
        observedAt:
          type: [string, 'null']
          format: date-time
        hosts:
          type: object
          required: [total, bySituation]
          additionalProperties: false
          properties:
            total:
              type: integer
            bySituation:
              $ref: '#/components/schemas/CountMap'
        containers:
          type: object
          required: [total, byDisplayStatus]
          additionalProperties: false
          properties:
            total:
              type: integer
            byDisplayStatus:
              $ref: '#/components/schemas/CountMap'
        engines:
          type: array
          items:
            type: object
            required: [engine, hosts, containers, versions]
            additionalProperties: false
            properties:
              engine:
                $ref: '#/components/schemas/EngineKind'
              hosts:
                type: integer
              containers:
                type: integer
              versions:
                type: array
                items:
                  type: object
                  required: [version, hosts]
                  additionalProperties: false
                  properties:
                    version:
                      type: string
                    hosts:
                      type: integer
        attentionEvents24h:
          type: integer
          minimum: 0
    OperationalEvent:
      type: object
      required: [eventId, environmentId, type, severity, occurredAt, receivedAt, clockSkewDetected, parameters, aggregatedCount]
      additionalProperties: false
      properties:
        eventId:
          type: string
          format: uuid
        environmentId:
          type: string
          format: uuid
        environmentName:
          type: [string, 'null']
        type:
          type: string
        severity:
          $ref: '#/components/schemas/EventSeverity'
        occurredAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        clockSkewDetected:
          type: boolean
        subjectKind:
          type: [string, 'null']
        subjectId:
          type: [string, 'null']
        subjectName:
          type: [string, 'null']
        parameters:
          type: object
          additionalProperties:
            type: string
        aggregatedCount:
          type: integer
          minimum: 1
    OperationalEventPage:
      type: object
      required: [events]
      additionalProperties: false
      properties:
        events:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/OperationalEvent'
        nextCursor:
          type: [string, 'null']
    ProblemDetails:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        traceId:
          type: string
        code:
          type: string
  responses:
    InvalidRequest:
      description: Requisição inválida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    AuthenticationRequired:
      description: Autenticação ausente ou inválida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    AccessDenied:
      description: Decisão do Keycloak negou o cadastro.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: O ambiente já existe.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: O ambiente não foi encontrado após autorização.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    DependencyUnavailable:
      description: Autorização ou persistência indisponível.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
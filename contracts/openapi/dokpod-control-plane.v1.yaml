openapi: 3.1.0
info:
  title: Dokpod Control Plane API
  version: 1.0.0
  description: >-
    Contrato público inicial do cadastro de ambientes do Dokpod.
    Operações marcadas com a extensão x-dokpod-edition: business existem só na composição Business
    (spec 031, D-009); na Community Edition a rota não é registrada e responde 404.
servers:
  - url: https://localhost:7443
paths:
  /api/v1/environments/{environmentId}/commands/{commandId}:
    get:
      operationId: getContainerCommand
      summary: Consulta o estado de um comando de ciclo de vida
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: commandId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Estado atual autorizado do comando.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerCommandStatus'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/environments/{environmentId}/containers/{containerId}/commands:
    post:
      operationId: submitContainerCommand
      summary: Solicita uma ação de ciclo de vida em um container
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: containerId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{64}$'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: Identifica de forma estável a intenção lógica para retries seguros.
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitContainerCommandRequest'
      responses:
        '202':
          description: Comando persistido ou replay idempotente aceito para processamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerCommandAccepted'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '422':
          description: Justificativa obrigatória pela política do estágio (justification_required).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/environments/{environmentId}/containers:
    get:
      operationId: listEnvironmentContainers
      summary: Consulta o inventário reconciliado de containers do ambiente
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Cursor opaco retornado pela página anterior.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Página autorizada da projeção de inventário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    post:
      operationId: createContainer
      summary: Cria e inicia um container no host (scope container:create, spec 013)
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContainerCreationRequest'
      responses:
        '202':
          description: Comando de criação aceito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerCreationAccepted'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/environments/{environmentId}/containers/{containerId}/terminal-policy:
    get:
      operationId: getTerminalPolicy
      summary: Política do terminal para o container (scope container:exec, spec 014)
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: containerId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{64}$'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Se o terminal pode ser aberto e o motivo quando não pode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalPolicy'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/terminal-sessions/{sessionId}/renew:
    post:
      operationId: renewTerminalSession
      summary: Reavalia a autorização da sessão de terminal com o token atual (renovado pelo BFF, D-008)
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Autorização renovada.
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
  /api/v1/environments/{environmentId}/create-options:
    get:
      operationId: getContainerCreateOptions
      summary: Dados do formulário de criação (segredos, redes e volumes do host, somente nomes)
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Opções do host.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerCreateOptions'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/environments/{environmentId}:
    get:
      operationId: getEnvironment
      summary: Consulta o estado cadastral de um ambiente
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Estado cadastral do ambiente autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/environments:
    get:
      operationId: listEnvironments
      summary: Lista os ambientes autorizados para o usuário
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Cursor opaco retornado pela página anterior.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: stage
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Stage'
        - name: engine
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EngineKind'
        - name: situation
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/HostSituation'
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Página de ambientes que o usuário pode consultar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    post:
      operationId: registerEnvironment
      summary: Cadastra um ambiente
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterEnvironmentRequest'
      responses:
        '201':
          description: Ambiente cadastrado.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentCreated'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/environments/{environmentId}/agent-identity/revoke:
    post:
      operationId: revokeAgentIdentity
      summary: Revoga as identidades ativas do agente de um ambiente
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Identidade do agente revogada.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/environments/{environmentId}/stage:
    put:
      operationId: setEnvironmentStage
      summary: Define o estágio do ambiente (idempotente; mesmo estágio não audita)
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetEnvironmentStageRequest'
      responses:
        '200':
          description: Estágio aplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentStageChanged'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/overview:
    get:
      operationId: getOverview
      summary: Resumo agregado dos hosts autorizados e habilitados
      security:
        - bearerAuth: []
      parameters:
        - name: stage
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Stage'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Resumo da visão geral.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewSummary'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/events:
    get:
      operationId: listEvents
      summary: Eventos operacionais dos hosts autorizados, mais recentes primeiro
      security:
        - bearerAuth: []
      parameters:
        - name: stage
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Stage'
        - name: environmentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: severity
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EventSeverity'
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Página de eventos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalEventPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/containers:
    get:
      operationId: listContainers
      summary: Lista unificada de containers dos hosts autorizados (hosts sem permissão são excluídos)
      security:
        - bearerAuth: []
      parameters:
        - name: stage
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Stage'
        - name: environmentId
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: engine
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/EngineKind'
        - name: displayStatus
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ContainerDisplayStatus'
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 128
        - name: sort
          in: query
          required: false
          description: >-
            Ordenação. `cpu`/`-cpu` e `memory`/`-memory` (spec 015) ordenam pelo consumo atual sobre todo o
            conjunto filtrado; containers sem amostra recente ficam no fim nas duas direções.
          schema:
            type: string
            enum: [name, -name, displayStatus, environment, createdAt, -createdAt, cpu, -cpu, memory, -memory]
            default: name
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Página da lista unificada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerListPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/images:
    get:
      operationId: listImages
      summary: Inventário de imagens dos hosts autorizados (spec 012)
      security:
        - bearerAuth: []
      parameters:
        - name: stage
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Stage'
        - name: environmentId
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: engine
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/EngineKind'
        - name: unused
          in: query
          required: false
          schema:
            type: boolean
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 128
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, -name, size, -size, createdAt, -createdAt]
            default: name
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Página do inventário de imagens com resumo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageListPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/environments/{environmentId}/images/lookup:
    get:
      operationId: lookupImage
      summary: Verifica se a imagem existe no host, sem consultar o registro
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: reference
          in: query
          required: true
          schema:
            type: string
            maxLength: 255
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Resultado da consulta pela referência normalizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageLookup'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/environments/{environmentId}/images/pull:
    post:
      operationId: pullImage
      summary: Baixa uma imagem no host (scope image:pull)
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: Uma chave por host; o retry com a mesma chave e a mesma referência é idempotente.
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PullImageRequest'
      responses:
        '202':
          description: Comando de pull aceito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullImageAccepted'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/environments/{environmentId}/containers/{containerId}:
    get:
      operationId: getContainer
      summary: Detalhe do container (projeção, host, engine, reinícios 24 h)
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: containerId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Resultado autorizado (conteúdo nunca persistido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerDetail'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/environments/{environmentId}/containers/{containerId}/summary:
    get:
      operationId: getContainerSummary
      summary: Resumo de configuração sanitizado no agente (container:inspect)
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: containerId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Resultado autorizado (conteúdo nunca persistido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerConfigSummary'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '504':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/environments/{environmentId}/containers/{containerId}/inspect:
    get:
      operationId: inspectContainer
      summary: Inspeção sanitizada no agente (container:inspect)
      security:
        - bearerAuth: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: containerId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Resultado autorizado (conteúdo nunca persistido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerInspection'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':

          type: [string, 'null']
          description: null sem licença importada ou com licença que não passa na reverificação.
          enum: [not_started, active, expired_in_grace, expired, null]
        metering:
          type: string
          enum: [regular, excess_in_grace, excess, unknown]
        reasons:
          type: array
          items:
            type: string
        license:
          oneOf:
            - $ref: '#/components/schemas/LicensingLicenseSummary'
            - type: 'null'
        installation:
          $ref: '#/components/schemas/LicensingInstallation'
        consumption:
          $ref: '#/components/schemas/LicensingConsumption'
        grace:
          oneOf:
            - $ref: '#/components/schemas/LicensingGrace'
            - type: 'null'
    LicensingLicenseSummary:
      type: object
      required: [licenseId, organizationId, revision, plan, notBefore, expiresAt, capabilities, capacity]
      properties:
        licenseId:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,128}$'
        organizationId:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,128}$'
        revision:
          type: integer
          minimum: 1
        plan:
          type: string
          maxLength: 64
        notBefore:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        capabilities:
          type: array
          maxItems: 64
          items:
            type: string
        capacity:
          type: object
          required: [mode]
          properties:
            mode:
              type: string
              enum: [limited, unlimited]
            nodeEquivalents:
              type: [integer, 'null']
              description: null quando ilimitada; nunca zero nem negativa.
    LicensingInstallation:
      type: object
      required: [slotId, kind, quota]
      properties:
        slotId:
          type: [string, 'null']
        kind:
          type: [string, 'null']
          enum: [production, staging, null]
        quota:
          type: [integer, 'null']
          description: null quando ilimitado.
    LicensingConsumption:
      type: object
      required: [vcpuBand, current, windowPeak, windowPeakAt, unknownHosts]
      properties:
        vcpuBand:
          type: [integer, 'null']
        current:
          type: [integer, 'null']
        windowPeak:
          type: [integer, 'null']
        windowPeakAt:
          type: [string, 'null']
          format: date-time
        unknownHosts:
          type: integer
          minimum: 0
    LicensingGrace:
      type: object
      required: [cause, startedAt, until]
      properties:
        cause:
          type: string
          enum: [expiry, excess]
        startedAt:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
    LicensingReport:
      type: object
      required: [reportVersion, installationId, generatedAt, challenge, status, hosts, chain, events]
      properties:
        reportVersion:
          type: integer
          enum: [1]
        installationId:
          type: string
          format: uuid
        slotId:
          type: [string, 'null']
        generatedAt:
          type: string
          format: date-time
        challenge:
          type: string
        status:
          $ref: '#/components/schemas/LicensingStatus'
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/LicensingReportHost'
        chain:
          type: object
          required: [headSeq, headHash]
          properties:
            headSeq:
              type: integer
              format: int64
            headHash:
              type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/LicensingChainEvent'
    LicensingReportHost:
      type: object
      properties:
        hostId:
          type: string
          format: uuid
        vcpus:
          type: [integer, 'null']
        source:
          type: string
          enum: [engine, process_fallback, unknown]
        nodeEquivalents:
          type: [integer, 'null']
        removed:
          type: boolean
      description: Só o ID opaco do host; o nome nunca sai da instalação (report-format.md, FR-007).
    LicensingChainEvent:
      type: object
      required: [chainSeq, eventId, occurredAt, actorRef, correlationId, action, details, prevHash, recordHash]
      properties:
        chainSeq:
          type: integer
          format: int64
        eventId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        actorRef:
          type: [string, 'null']
          description: HMAC-SHA256 do sujeito com chave da instalação; nunca o sujeito do Keycloak.
        correlationId:
          type: string
          format: uuid
        action:
          type: string
        details:
          type: object
        prevHash:
          type: string
        recordHash:
          type: string
    LicensingHostRequest:
      type: object
      required: [label]
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 128
    LicensingHostList:
      type: object
      required: [hosts]
      properties:
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/LicensingHost'
    LicensingHost:
      type: object
      required: [hostId, label, removed, environmentIds, vcpus, source, nodeEquivalents]
      properties:
        hostId:
          type: string
          format: uuid
        label:
          type: string
        removed:
          type: boolean
        environmentIds:
          type: array
          items:
            type: string
            format: uuid
        vcpus:
          type: [integer, 'null']
        source:
          type: string
          enum: [engine, process_fallback, unknown]
        nodeEquivalents:
          type: [integer, 'null']
    TrustedInstantResetRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 500
          description: Justificativa gravada na cadeia e levada ao relatório de auditoria; não inclua dados pessoais.
  responses:
    InvalidRequest:
      description: Requisição inválida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    AuthenticationRequired:
      description: Autenticação ausente ou inválida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    AccessDenied:
      description: Decisão do Keycloak negou o cadastro.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: O ambiente já existe.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: O ambiente não foi encontrado após autorização.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    DependencyUnavailable:
      description: Autorização ou persistência indisponível.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    LicensingDenied:
      description: Autorização negada pelo Keycloak (authorization_denied) ou recusa por licença (license_expired, license_capacity_exceeded, license_revoked, license_state_indeterminate); nunca encerra a sessão.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    AuditExportDenied:
      description: Autorização negada pelo Keycloak (authorization_denied) ou recusa por licença (license_expired, license_capacity_exceeded, license_revoked, license_state_indeterminate, license_invalid).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    AuditExportProblem:
      description: Recusa tipada da exportação de auditoria; ProblemDetails.code segue AuditExportProblemCode.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    LicensingProblem:
      description: Recusa tipada de licenciamento; ProblemDetails.code segue LicensingProblemCode. A licença íntegra anterior continua em vigor.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

      responses:
        '200':
          description: Cadeia de licenciamento completa e resumo de consumo, pico, faixa, hosts com origem da CPU e prazos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicensingReport'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/LicensingDenied'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/licensing/license:
    put:
      operationId: importLicense
      summary: Importa ou renova a licença (licensing:manage)
      description: Spec 031. Ordem autenticar, autorizar no Keycloak, avaliar e persistir (FR-022). Reimportação idêntica não tem efeito.
      x-dokpod-edition: business
      security:
        - bearerAuth: []
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
        - name: slotId
          in: query
          required: true
          schema:
            type: string
            maxLength: 64
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/jose:
            schema:
              type: string
              maxLength: 65536
      responses:
        '200':
          description: Licença aceita, ou reimportação idêntica sem efeito; estado atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicensingStatus'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/LicensingDenied'
        '412':
          $ref: '#/components/responses/LicensingProblem'
        '413':
          $ref: '#/components/responses/LicensingProblem'
        '422':
          $ref: '#/components/responses/LicensingProblem'
        '429':
          $ref: '#/components/responses/LicensingProblem'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/licensing/revocations:
    post:
      operationId: importRevocation
      summary: Importa pacote de revogação assinado (licensing:manage)
      x-dokpod-edition: business
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/jose:
            schema:
              type: string
              maxLength: 65536
      responses:
        '200':
          description: Pacote aceito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicensingStatus'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/LicensingDenied'
        '413':
          $ref: '#/components/responses/LicensingProblem'
        '422':
          $ref: '#/components/responses/LicensingProblem'
        '429':
          $ref: '#/components/responses/LicensingProblem'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/licensing/hosts:
    get:
      operationId: listLicensingHosts
      summary: Hosts de licenciamento com ambientes, CPU e origem (licensing:read)
      description: Spec 031 (D-004). Um host com vários engines conta uma vez; origem diferente de engine é medição desconhecida.
      x-dokpod-edition: business
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Hosts conhecidos, inclusive removidos ainda na janela.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicensingHostList'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/LicensingDenied'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/licensing/hosts/{hostId}:
    put:
      operationId: createLicensingHost
      summary: Cria o host com o ID informado pelo cliente; repetir não muda nada (licensing:manage)
      x-dokpod-edition: business
      security:
        - bearerAuth: []
      parameters:
        - name: hostId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LicensingHostRequest'
      responses:
        '200':
          description: O host já existia.
        '201':
          description: Host criado.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/LicensingDenied'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    delete:
      operationId: removeLicensingHost
      summary: Remove o host sem apagar o histórico da janela; desassocia os ambientes (licensing:manage)
      x-dokpod-edition: business
      security:
        - bearerAuth: []
      parameters:
        - name: hostId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Removido, ou já estava.
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/LicensingDenied'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/licensing/hosts/{hostId}/environments/{environmentId}:
    put:
      operationId: linkLicensingHostEnvironment
      summary: Associa o ambiente ao host; se estava em outro host ativo, desassocia de lá (licensing:manage)
      x-dokpod-edition: business
      security:
        - bearerAuth: []
      parameters:
        - name: hostId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Associado, ou já estava.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/LicensingDenied'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    delete:
      operationId: unlinkLicensingHostEnvironment
      summary: Desassocia o ambiente do host (licensing:manage)
      x-dokpod-edition: business
      security:
        - bearerAuth: []
      parameters:
        - name: hostId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Desassociado, ou não estava associado.
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/LicensingDenied'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/licensing/trusted-instant:
    post:
      operationId: resetTrustedInstant
      summary: Sai de indeterminate regravando o instante confiável com o relógio atual (licensing:manage)
      description: Spec 031 (D-006). Nunca concede tolerância nova; grava license.trusted_instant_reset na cadeia.
      x-dokpod-edition: business
      security:
        - bearerAuth: []
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustedInstantResetRequest'
      responses:
        '200':
          description: Instante regravado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicensingStatus'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/LicensingDenied'
        '409':
          $ref: '#/components/responses/LicensingProblem'
        '412':
          $ref: '#/components/responses/LicensingProblem'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/settings/audit-export/destinations:
    get:
      operationId: listAuditExportDestinations
      summary: Lista os destinos de exportação da auditoria com situação e fila (audit-export:read)
      description: >-
        Spec 027 (FR-005, FR-006). Não passa pelo gate da licença: com a licença restrita, a situação continua visível.
        O conteúdo dos secrets nunca sai; secretFiles diz só se cada arquivo existe.
      x-dokpod-edition: business
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Destinos, em ordem de nome.
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items:
                  $ref: '#/components/schemas/AuditExportDestination'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuditExportDenied'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    post:
      operationId: createAuditExportDestination
      summary: Cria um destino de exportação (audit-export:manage; capability audit-siem-export)
      description: >-
        Spec 027 (FR-005, FR-007). A categoria audit_export é sempre incluída (threat model L7). A repetição com a mesma
        Idempotency-Key em até 24 h devolve o mesmo destino.
      x-dokpod-edition: business
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: Identifica de forma estável a intenção lógica para retries seguros; vale 24 horas.
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditExportDestinationInput'
      responses:
        '201':
          description: Destino criado (ou repetição idempotente); o cursor começa no fim da trilha.
          headers:
            ETag:
              schema:
                type: string
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditExportDestination'
        '400':
          $ref: '#/components/responses/AuditExportProblem'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuditExportDenied'
        '409':
          $ref: '#/components/responses/AuditExportProblem'
        '422':
          $ref: '#/components/responses/AuditExportProblem'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/settings/audit-export/destinations/{destinationId}:
    parameters:
      - name: destinationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateAuditExportDestination
      summary: Edita, reativa ou desativa um destino (audit-export:manage)
      description: >-
        Spec 027 (FR-005, FR-008). Editar e reativar passam pelo gate da capability audit-siem-export; desativar
        (active false sem outra mudança) nunca é bloqueado pela licença.
      x-dokpod-edition: business
      security:
        - bearerAuth: []
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditExportDestinationInput'
      responses:
        '200':
          description: Destino atualizado.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditExportDestination'
        '400':
          $ref: '#/components/responses/AuditExportProblem'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuditExportDenied'
        '404':
          $ref: '#/components/responses/AuditExportProblem'
        '409':
          $ref: '#/components/responses/AuditExportProblem'
        '412':
          $ref: '#/components/responses/AuditExportProblem'
        '422':
          $ref: '#/components/responses/AuditExportProblem'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    delete:
      operationId: deleteAuditExportDestination
      summary: Exclui um destino (audit-export:manage); nunca bloqueado pela licença
      x-dokpod-edition: business
      security:
        - bearerAuth: []
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Destino e cursor removidos.
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuditExportDenied'
        '404':
          $ref: '#/components/responses/AuditExportProblem'
        '412':
          $ref: '#/components/responses/AuditExportProblem'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/settings/audit-export/destinations/{destinationId}/test:
    parameters:
      - name: destinationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: testAuditExportDestination
      summary: Envia um evento de teste ao destino (audit-export:manage; capability audit-siem-export)
      description: >-
        Spec 027 (Jornada 1, cenário 2). O evento de teste (audit_export.test) não entra na trilha; o envio é registrado
        como audit_export.test_sent. Até 5 testes por minuto por instalação (threat model L8).
      x-dokpod-edition: business
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Resultado do envio; errorCode presente quando não entregue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditExportTestResult'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuditExportDenied'
        '404':
          $ref: '#/components/responses/AuditExportProblem'
        '429':
          $ref: '#/components/responses/AuditExportProblem'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Identificador técnico opcional para correlação server-side.
  schemas:
    SubmitContainerCommandRequest:
      type: object
      required: [action, expectedContainerRevision, deadlineUtc]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [start, stop, restart, delete, pause, unpause]
        expectedContainerRevision:
          type: string
          minLength: 1
          maxLength: 255
        deadlineUtc:
          type: string
          format: date-time
        justification:
          type: string
          minLength: 10
          maxLength: 500
          description: Obrigatória para stop, pause e delete quando a política do estágio exige (spec 016); senão 422 justification_required.
    ImageListPage:
      type: object
      required: [images, summary, nextCursor]
      additionalProperties: false
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageItem'
        summary:
          type: object
          required: [total, unused, totalSizeBytes, partial]
          additionalProperties: false
          properties:
            total:
              type: integer
            unused:
              type: integer
            totalSizeBytes:
              type: integer
              format: int64
            partial:
              type: boolean
        nextCursor:
          type: [string, 'null']
    ImageItem:
      type: object
      required: [environmentId, environmentName, imageId, repoTags, repoDigests, sizeBytes, containers, inUse, truncated, observedAt, canPull]
      additionalProperties: false
      properties:
        environmentId:
          type: string
          format: uuid
        environmentName:
          type: string
        stage:
          oneOf:
            - $ref: '#/components/schemas/Stage'
            - type: 'null'
        engine:
          oneOf:
            - $ref: '#/components/schemas/EngineKind'
            - type: 'null'
        imageId:
          type: string
        repository:
          type: [string, 'null']
        tag:
          type: [string, 'null']
        repoTags:
          type: array
          maxItems: 64
          items:
            type: string
        repoDigests:
          type: array
          maxItems: 64
          items:
            type: string
        sizeBytes:
          type: integer
          format: int64
        createdAt:
          type: [string, 'null']
          format: date-time
        architecture:
          type: [string, 'null']
        os:
          type: [string, 'null']
        truncated:
          type: boolean
        containers:
          type: integer
        inUse:
          type: boolean
        observedAt:
          type: string
          format: date-time
        canPull:
          type: boolean
    ImageLookup:
      type: object
      required: [reference, mutableTag, present]
      additionalProperties: false
      properties:
        reference:
          type: string
        mutableTag:
          type: boolean
        present:
          type: boolean
        imageId:
          type: [string, 'null']
        sizeBytes:
          type: [integer, 'null']
          format: int64
        createdAt:
          type: [string, 'null']
          format: date-time
        digest:
          type: [string, 'null']
    PullImageRequest:
      type: object
      required: [reference, deadlineUtc]
      additionalProperties: false
      properties:
        reference:
          type: string
          minLength: 1
          maxLength: 255
        deadlineUtc:
          type: string
          format: date-time
    PullImageAccepted:
      type: object
      required: [commandId]
      additionalProperties: false
      properties:
        commandId:
          type: string
          format: uuid
        reference:
          type: [string, 'null']
    ContainerCreationRequest:
      type: object
      required: [image, name]
      additionalProperties: false
      description: Allowlist fechada (spec 013); qualquer outro campo resulta em 400.
      properties:
        image:
          type: string
          maxLength: 255
        name:
          type: string
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,62}$'
        ports:
          type: array
          maxItems: 32
          items:
            type: object
            required: [hostPort, containerPort, protocol]
            additionalProperties: false
            properties:
              hostIp:
                type: [string, 'null']
              hostPort:
                type: integer
                minimum: 0
                maximum: 65535
              containerPort:
                type: integer
                minimum: 1
                maximum: 65535
              protocol:
                type: string
                enum: [tcp, udp]
        environment:
          type: array
          maxItems: 100
          items:
            type: object
            required: [name]
            additionalProperties: false
            properties:
              name:
                type: string
                pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}$'
              value:
                type: [string, 'null']
                maxLength: 32768
              secret:
                oneOf:
                  - type: 'null'
                  - type: object
                    required: [kind, name]
                    additionalProperties: false
                    properties:
                      kind:
                        type: string
                        enum: [podman_secret, file]
                      name:
                        type: string
              sensitive:
                type: boolean
        volumes:
          type: array
          maxItems: 10
          items:
            type: object
            required: [type, source, target]
            additionalProperties: false
            properties:
              type:
                type: string
                enum: [volume, bind]
              source:
                type: string
              target:
                type: string
              readOnly:
                type: boolean
        network:
          type: [string, 'null']
        cpuLimitCores:
          type: [number, 'null']
          minimum: 0.01
          maximum: 64
        memoryLimitBytes:
          type: [integer, 'null']
          format: int64
        restartPolicy:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              enum: ['no', on-failure, always, unless-stopped]
            maximumRetryCount:
              type: [integer, 'null']
              minimum: 0
              maximum: 100
        healthcheck:
          oneOf:
            - type: 'null'
            - type: object
              required: [test, intervalSeconds, timeoutSeconds, retries, startPeriodSeconds, onFailure]
              additionalProperties: false
              properties:
                test:
                  type: array
                  maxItems: 16
                  items:
                    type: string
                intervalSeconds:
                  type: integer
                timeoutSeconds:
                  type: integer
                retries:
                  type: integer
                startPeriodSeconds:
                  type: integer
                onFailure:
                  type: string
                  enum: [none, restart]
        autoRemove:
          type: boolean
        deadlineUtc:
          type: [string, 'null']
          format: date-time
    ContainerCreationAccepted:
      type: object
      required: [commandId]
      additionalProperties: false
      properties:
        commandId:
          type: string
          format: uuid
        equivalentCommand:
          type: [string, 'null']
    ContainerCreateOptions:
      type: object
      required: [engine, engineVersion, secrets, networks, volumes, allowedRegistries, bindMountsAllowed, partial, limits]
      additionalProperties: false
      properties:
        engine:
          $ref: '#/components/schemas/EngineKind'
        engineVersion:
          type: string
        rootless:
          type: [boolean, 'null']
        secrets:
          type: array
          items:
            type: object
            required: [kind, name]
            additionalProperties: false
            properties:
              kind:
                type: string
                enum: [podman_secret, file]
              name:
                type: string
        networks:
          type: array
          items:
            type: object
            required: [name]
            additionalProperties: false
            properties:
              name:
                type: string
              driver:
                type: [string, 'null']
        volumes:
          type: array
          items:
            type: object
            required: [name]
            additionalProperties: false
            properties:
              name:
                type: string
        allowedRegistries:
          type: array
          items:
            type: string
        bindMountsAllowed:
          type: boolean
        partial:
          type: boolean
        limits:
          type: object
          required: [ports, environment, volumes, valueBytes]
          additionalProperties: false
          properties:
            ports:
              type: integer
            environment:
              type: integer
            volumes:
              type: integer
            valueBytes:
              type: integer
    TerminalPolicy:
      type: object
      required: [allowed, requiresJustification, requiresRecentMfa, limits]
      additionalProperties: false
      properties:
        allowed:
          type: boolean
        reason:
          type: [string, 'null']
          description: scope, not_running, not_supported, agent_disconnected, mfa_required, not_found.
        requiresJustification:
          type: boolean
        requiresRecentMfa:
          type: boolean
        limits:
          type: object
          required: [idleTimeoutSeconds, maxDurationSeconds, maxPerUser, maxPerUserPerContainer, maxPerAgent, justificationMinLength, justificationMaxLength]
          additionalProperties: false
          properties:
            idleTimeoutSeconds:
              type: integer
            maxDurationSeconds:
              type: integer
            maxPerUser:
              type: integer
            maxPerUserPerContainer:
              type: integer
            maxPerAgent:
              type: integer
            justificationMinLength:
              type: integer
            justificationMaxLength:
              type: integer
    ContainerCommandAccepted:
      type: object
      required: [commandId]
      additionalProperties: false
      properties:
        commandId:
          type: string
          format: uuid
    ContainerCommandStatus:
      type: object
      required:
        - environmentId
        - commandId
        - action
        - containerId
        - expectedContainerRevision
        - state
        - failureCode
        - observedContainerRevision
        - deadlineUtc
        - createdAtUtc
        - updatedAtUtc
        - completedAtUtc
      additionalProperties: false
      properties:
        environmentId:
          type: string
          format: uuid
        commandId:
          type: string
          format: uuid
        action:
          type: string
          enum: [start, stop, restart, delete, pause, unpause, pull, create, remove_volume, remove_network, pod_start, pod_stop, pod_restart, pod_pause, pod_unpause]
        kind:
          type: string
          enum: [container, image, pod]
          description: Alvo do comando (spec 012); `image` para pull com alvo de host.
        containerId:
          type: [string, 'null']
          pattern: '^[0-9a-fA-F]{64}$'
          description: Nulo para comandos com alvo de host.
        expectedContainerRevision:
          type: [string, 'null']
          minLength: 1
          maxLength: 255
        reference:
          type: [string, 'null']
          maxLength: 255
          description: Referência canônica da imagem do pull (012) ou da criação (013).
        containerName:
          type: [string, 'null']
          description: Nome pedido na criação (spec 013).
        podName:
          type: [string, 'null']
          description: Pod alvo de uma ação de pod (spec 021).
        result:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              properties:
                resolvedImageDigest:
                  type: [string, 'null']
                imageSizeBytes:
                  type: [integer, 'null']
                  format: int64
                createdContainerId:
                  type: [string, 'null']
                  description: Container criado (spec 013); presente também em `start_failed`.
                failedContainers:
                  type: [array, 'null']
                  description: Membros do pod fora do estado esperado após a ação (spec 021, `pod_partial_failure`).
                  items:
                    type: string
        state:
          type: string
          enum: [pending, dispatched, accepted, succeeded, failed, indeterminate]
        failureCode:
          type: [string, 'null']
          maxLength: 128
        observedContainerRevision:
          type: [string, 'null']
          maxLength: 255
        deadlineUtc:
          type: string
          format: date-time
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
        completedAtUtc:
          type: [string, 'null']
          format: date-time
